    const K_READINESS = 'pl-readiness';
    const K_LIBRARY = 'pl-library';
    const K_PROGRAM = 'pl-program';

    let state = {
      view: 'today',
      library: {},
      program: { name: '', weeks: [] },
      progress: {},
      bw: {},
      readiness: {},
      activeSession: null,
      sessionData: null,
      openWeek: null,
      editorExpandedWeeks: {},
      editorLibraryFilter: 'all',
      modal: null,
    };

    let timer = { interval: null, secLeft: 0, exName: '', active: false };
    let nextAnim = 'fade';
    let lastToggle = null;

    function loadAll() {
      try { const r = localStorage.getItem(K_PROGRESS); if (r) state.progress = JSON.parse(r); } catch (e) {}
      try { const r = localStorage.getItem(K_BW); if (r) state.bw = JSON.parse(r); } catch (e) {}
      try { const r = localStorage.getItem(K_READINESS); if (r) state.readiness = JSON.parse(r); } catch (e) {}
      try { const r = localStorage.getItem(K_LIBRARY); if (r) state.library = JSON.parse(r); } catch (e) {}
      try { const r = localStorage.getItem(K_PROGRAM); if (r) state.program = JSON.parse(r); } catch (e) {}
    }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function saveProgress() { save(K_PROGRESS, state.progress); }
    function saveBw() { save(K_BW, state.bw); }
    function saveReadiness() { save(K_READINESS, state.readiness); }
    function saveLibrary() { save(K_LIBRARY, state.library); }
    function saveProgram() { save(K_PROGRAM, state.program); }

    // ============================================================
    // HELPERS
    // ============================================================
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtTime(s) { const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, '0')}`; }
    function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
    function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function dateInfo() { return new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
    function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
    function fmtDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
    function fmtDateShort(s) { return new Date(s + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
    function e1rm(w, r) { if (!w || !r || r < 1) return null; const rr = Math.min(parseInt(r), 12); if (rr === 1) return w; return w * 36 / (37 - rr); }

    function getLibEx(libId) {
      return state.library[libId] || null;
    }

    // Get exercise definition (name, group) with backward compat for old data
    function getExDef(ex) {
      if (ex.libId) {
        const lib = getLibEx(ex.libId);
        if (lib) return lib;
      }
      // Fallback: search by name
      if (ex.name) {
        const found = Object.values(state.library).find(x => x.name === ex.name);
        if (found) return found;
        return { name: ex.name, group: 'other' };
      }
      return { name: '?', group: 'other' };
    }

    function programWeeks() { return state.program.weeks || []; }

    function findWeekById(id) { return programWeeks().find(w => w.id === id); }
    function findDayById(weekId, dayId) {
      const w = findWeekById(weekId);
      return w ? w.days.find(d => d.id === dayId) : null;
    }

    function sessionKey(wId, dId) { return `${wId}::${dId}`; }

    function findNextSession() {
      const today = todayKey();
      for (const w of programWeeks()) {
        for (const d of w.days) {
          if (d.date === today) {
            const k = sessionKey(w.id, d.id);
            if (!state.progress[k]?.completed) return { weekId: w.id, dayId: d.id };
          }
        }
      }
      for (const w of programWeeks()) {
        for (const d of w.days) {
          const k = sessionKey(w.id, d.id);
          if (!state.progress[k]?.completed) return { weekId: w.id, dayId: d.id };
        }
      }
      return null;
    }

    function findTodaySessionType() {
      const today = todayKey();
      const next = findNextSession();
      if (!next) return { type: 'done', next: null };
      for (const w of programWeeks()) {
        for (const d of w.days) {
          if (d.date === today) {
            const k = sessionKey(w.id, d.id);
            if (state.progress[k]?.completed) return { type: 'done-today', next };
            return { type: 'today', weekId: w.id, dayId: d.id };
          }
        }
      }
      return { type: 'rest', next };
    }

    function findNextTest() {
      const today = todayKey();
      const tests = [];
      for (const w of programWeeks()) {
        for (const d of w.days) {
          if (d.isTest && d.date && d.date >= today) {
            const k = sessionKey(w.id, d.id);
            if (!state.progress[k]?.completed) tests.push({ ...d, weekId: w.id });
          }
        }
      }
      tests.sort((a, b) => a.date.localeCompare(b.date));
      return tests[0] || null;
    }

    function daysSinceLastLift(group) {
      const groupMap = { squat: ['squat'], bench: ['bench'], deadlift: ['deadlift'], ohp: ['ohp'] };
      const targetGroups = groupMap[group] || [group];
      let mostRecent = null;
      for (const [k, sess] of Object.entries(state.progress)) {
        if (!sess.completed || !sess.date) continue;
        const has = sess.exercises.some(e => {
          const def = getExDef(e);
          return def && targetGroups.includes(def.group) && e.sets.some(s => s.done);
        });
        if (has) {
          const d = new Date(sess.date);
          if (!mostRecent || d > mostRecent) mostRecent = d;
        }
      }
      if (!mostRecent) return null;
      return Math.floor((new Date() - mostRecent) / 86400000);
    }

    function findLastCompletedSession() {
      const completed = Object.entries(state.progress)
        .filter(([_, s]) => s.completed)
        .map(([k, s]) => ({ k, ...s }))
        .sort((a, b) => new Date(b.date) - new Date(a.date));
      return completed[0] || null;
    }

    function findDayByDate(dateStr) {
      for (const w of programWeeks()) {
        for (const d of w.days) if (d.date === dateStr) return { week: w, day: d };
      }
      return null;
    }

    function getTodayBw() { return state.bw[todayKey()] ?? null; }
    function getRecentBw() { const k = Object.keys(state.bw).sort().reverse(); return k.length ? state.bw[k[0]] : null; }
    function getTodayReadiness() { return state.readiness[todayKey()] ?? null; }

    // ============================================================
    // RENDER: TODAY
    // ============================================================
    function renderToday() {
      const total = programWeeks().reduce((a, w) => a + w.days.length, 0);
      const done = Object.values(state.progress).filter(p => p.completed).length;
      const pct = total ? Math.round(done / total * 100) : 0;
      const dl = dateInfo();
      const dateLine = dl.charAt(0).toUpperCase() + dl.slice(1);

      const nextTest = findNextTest();
      let cdBlock = '';
      if (nextTest) {
        const days = daysBetween(todayKey(), nextTest.date);
        const lbl = nextTest.name.replace(/^TEST\s+/i, '').replace(/\s+\+\s*OHP.*$/i, '').toUpperCase();
        cdBlock = `
          <div class="countdown">
            <div>
              <div class="countdown-label">PROCHAIN TEST</div>
              <div class="countdown-target">${esc(lbl)}</div>
              <div class="countdown-date">${esc(fmtDate(nextTest.date))}</div>
            </div>
            <div>
              <div class="countdown-num">J−${days}</div>
              <div class="countdown-num-sub">JOURS</div>
            </div>
          </div>`;
      }

      const lifts = [{ g:'squat', l:'SQ' }, { g:'bench', l:'BP' }, { g:'deadlift', l:'DL' }, { g:'ohp', l:'OHP' }];
      const recBlock = `
        <div class="recovery">
          <div class="recovery-head"><span class="section-label">STATUT RÉCUP</span></div>
          <div class="recovery-grid">
            ${lifts.map(lk => {
              const d = daysSinceLastLift(lk.g);
              let cls = 'never', txt = '—';
              if (d !== null) {
                if (d === 0) { cls = 'fresh'; txt = 'auj'; }
                else if (d <= 2) { cls = 'warning'; txt = d + 'j'; }
                else { cls = 'ready'; txt = d + 'j'; }
              }
              return `<div class="recovery-item"><span class="recovery-lift">${lk.l}</span><span class="recovery-time ${cls}">${txt}</span></div>`;
            }).join('')}
          </div>
        </div>`;

      const bw = getTodayBw() ?? getRecentBw();
      const readiness = getTodayReadiness();
      const emojis = ['😴', '🙂', '💪', '🔥'];
      const quickBlock = `
        <div class="quick-row">
          <div class="quick-card">
            <div class="eyebrow">POIDS DE CORPS</div>
            <div class="bw-display ${bw === null ? 'empty' : ''}" data-action="edit-bw">
              ${bw !== null ? bw.toFixed(1).replace('.', ',') + '<span class="bw-unit">kg</span>' : 'noter'}
            </div>
          </div>
          <div class="quick-card">
            <div class="eyebrow">ÉTAT DU JOUR</div>
            <div class="readiness-row">
              ${emojis.map(e => `<button class="readiness-btn ${readiness === e ? 'selected' : ''}" data-action="set-readiness" data-emoji="${e}">${e}</button>`).join('')}
            </div>
          </div>
        </div>`;

      const ti = findTodaySessionType();
      let sessionBlock = '';
      if (ti.type === 'done') {
        sessionBlock = `
          <div class="session-section">
            <div class="section-label">PROGRAMME TERMINÉ</div>
            <div class="session-day-name">${done}/${total} séances</div>
            <div class="session-week-info">Bien joué.</div>
          </div>`;
      } else {
        let label, wId, dId, btn;
        if (ti.type === 'today') { label = 'SÉANCE DU JOUR'; btn = 'DÉMARRER LA SÉANCE'; wId = ti.weekId; dId = ti.dayId; }
        else if (ti.type === 'done-today') { label = 'TERMINÉE AUJOURD\'HUI · PROCHAINE :'; btn = 'VOIR LA SÉANCE'; wId = ti.next.weekId; dId = ti.next.dayId; }
        else { label = 'JOUR DE REPOS · PROCHAINE :'; btn = 'VOIR LA SÉANCE'; wId = ti.next.weekId; dId = ti.next.dayId; }
        const w = findWeekById(wId), d = findDayById(wId, dId);
        if (w && d) {
          sessionBlock = `
            <div class="session-section">
              <div class="section-label">${label}</div>
              <div class="session-day-name">${esc(d.label)} · ${esc(d.name)}</div>
              <div class="session-week-info">${esc(w.name)}${d.date ? ' · ' + fmtDateShort(d.date) : ''}</div>
              <div class="ex-list">
                ${(d.ex || []).map(e => {
                  const def = getExDef(e);
                  const stats = e.isTest ? `${e.overrides ? e.overrides.length : e.sets} étapes`
                    : `${e.sets}×${e.reps}${e.weight ? ` · ${e.weight}kg` : ''}${e.rpe ? ` · RPE ${e.rpe}` : ''}`;
                  return `<div class="ex-list-row">
                    <div class="ex-list-name"><span class="ex-mark ${e.main ? 'main' : ''}">${e.main ? '●' : '○'}</span>${esc(def.name)}</div>
                    <div class="ex-list-stats">${stats}</div>
                  </div>`;
                }).join('')}
              </div>
              <button class="cta" data-action="start-session" data-week="${w.id}" data-day="${d.id}">${btn}</button>
            </div>`;
        }
      }

      const last = findLastCompletedSession();
      let lastBlock = '';
      if (last) {
        const found = last.date ? findDayByDate(last.date) : null;
        let title = 'Séance complétée';
        if (found) title = `${found.day.label} · ${found.day.name}`;
        const mainEx = last.exercises.find(e => {
          // find any main exercise
          const parts = last.k.split('::');
          const wk = findWeekById(parts[0]);
          if (!wk) return false;
          const dy = wk.days.find(x => x.id === parts[1]);
          if (!dy) return false;
          const def = dy.ex.find(x => (x.libId && x.libId === e.libId) || (!x.libId && x.name === e.name));
          return def?.main;
        });
        let topStr = '';
        if (mainEx) {
          const topSet = mainEx.sets.filter(s => s.done && s.weight).reduce((m, s) => s.weight > (m?.weight || 0) ? s : m, null);
          if (topSet) {
            const name = getExDef(mainEx).name;
            topStr = `Top: ${name.split('—')[0].trim()} ${topSet.weight}×${topSet.reps}${topSet.rpe ? ' RPE ' + topSet.rpe : ''}`;
          }
        }
        lastBlock = `
          <div class="last-session">
            <div class="eyebrow">DERNIÈRE SÉANCE</div>
            <div class="last-session-info">${esc(title)}</div>
            ${topStr ? `<div class="last-session-detail">${esc(topStr)}</div>` : ''}
          </div>`;
      } else {
        lastBlock = `<div class="last-session"><div class="eyebrow">DERNIÈRE SÉANCE</div><div class="last-session-empty">Pas encore de séance complétée.</div></div>`;
      }

      return `<div class="pad">
        <div class="eyebrow">${esc(dateLine)}</div>
        <h1>Aujourd'hui</h1>
        ${cdBlock}
        ${recBlock}
        ${quickBlock}
        ${sessionBlock}
        ${lastBlock}
        <div class="progress-block">
          <div class="progress-lbl"><span>PROGRESSION</span><span>${done}/${total}</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div>`;
    }

    // ============================================================
    // RENDER: PROGRAMME
    // ============================================================
    function renderProgram() {
      if (!state.openWeek && programWeeks().length > 0) state.openWeek = programWeeks()[0].id;
      const w = findWeekById(state.openWeek);

      const tabsCount = programWeeks().length;
      const tabStyle = `grid-template-columns: repeat(${Math.min(tabsCount, 8)}, 1fr);`;

      return `<div class="pad">
        <div class="eyebrow">${esc(state.program.name || 'Programme').toUpperCase()}</div>
        <h1>Programme</h1>
        ${tabsCount === 0 ? `
          <div class="empty">Aucune semaine. Va dans l'éditeur pour créer ton programme.</div>
        ` : `
          <div class="week-tabs" style="${tabStyle}">
            ${programWeeks().map(wk => `
              <button class="week-tab ${wk.id === state.openWeek ? 'active' : ''}" data-action="open-week" data-week="${wk.id}">S${wk.days.length ? (programWeeks().indexOf(wk)+1) : '?'}</button>
            `).join('')}
          </div>
          ${w ? `
            <div class="block-badge">${esc(w.name)}</div>
            ${w.days.map(d => {
              const done = state.progress[sessionKey(w.id, d.id)]?.completed;
              const preview = (d.ex || []).slice(0, 3).map(e => getExDef(e).name.split(' ')[0]).join(' · ');
              const more = d.ex.length > 3 ? ` · +${d.ex.length - 3}` : '';
              const cls = `day-row ${done ? 'done' : ''} ${d.isTest ? 'test' : ''}`.trim();
              return `<button class="${cls}" data-action="start-session" data-week="${w.id}" data-day="${d.id}">
                <div>
                  <div class="day-label">${esc(d.label)}${d.date ? ' · ' + fmtDateShort(d.date) : ''}</div>
                  <div class="day-name">${esc(d.name)}</div>
                  <div class="day-date">${esc(preview)}${more}</div>
                </div>
                <div class="day-arrow ${done ? 'done' : ''}">${done ? '✓' : '›'}</div>
              </button>`;
            }).join('')}
          ` : ''}
        `}
      </div>`;
    }

    // ============================================================
    // RENDER: SESSION
    // ============================================================
    function renderSession() {
      const { weekId, dayId } = state.activeSession;
      const w = findWeekById(weekId);
      const d = findDayById(weekId, dayId);
      if (!w || !d) { setView('today'); return ''; }
      const sd = state.sessionData;
      const totalSets = sd.exercises.reduce((a, e) => a + e.sets.length, 0);
      const doneSets = sd.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
      const pct = totalSets ? (doneSets / totalSets) * 100 : 0;

      return `<div class="pad" style="padding-bottom:120px;">
        <button class="back-btn" data-action="back-to-today">← retour</button>
        <div class="eyebrow">${esc(w.name.toUpperCase())} · ${esc(d.label.toUpperCase())}${d.date ? ' · ' + fmtDateShort(d.date) : ''}</div>
        <h1>${esc(d.name)}</h1>
        <div class="session-progress">
          <span>${doneSets}/${totalSets} séries</span>
          <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
        </div>
        ${sd.exercises.map((ex, exIdx) => {
          const def = d.ex[exIdx];
          const libDef = getExDef(def);
          const isTest = def.isTest;
          return `<div class="ex-card">
            <div class="ex-name">${esc(libDef.name)}</div>
            ${!isTest ? `<div class="ex-target">Cible : ${def.sets}×${def.reps}${def.weight ? ` @ ${def.weight} kg` : ''}${def.rpe ? ` (RPE ${def.rpe})` : ''}</div>` : ''}
            ${def.note ? `<div class="ex-note">${esc(def.note)}</div>` : ''}
            ${isTest ? `<div class="ex-test-banner">TEST · échauffement progressif puis essais</div>` : ''}
            <div class="sets-grid ${isTest ? 'with-label' : ''}">
              <div class="set-head">#</div>
              ${isTest ? '<div class="set-head">étape</div>' : '<div class="set-head">kg</div>'}
              <div class="set-head">${isTest ? 'kg' : 'reps'}</div>
              <div class="set-head">${isTest ? 'reps' : 'RPE'}</div>
              <div class="set-head">✓</div>
              ${ex.sets.map((set, si) => {
                const lblTxt = set.label || '';
                const isAtt = /essai|stretch|pr|single/i.test(lblTxt);
                return `<div class="set-num">${si+1}</div>
                  ${isTest ? `<div class="set-label ${isAtt ? 'attempt' : ''}">${esc(lblTxt)}</div>` : ''}
                  <input class="set-input" type="number" step="2.5" inputmode="decimal" data-ex="${exIdx}" data-set="${si}" data-field="weight" value="${set.weight ?? ''}" placeholder="—">
                  <input class="set-input" type="${isTest ? 'number' : 'text'}" inputmode="numeric" data-ex="${exIdx}" data-set="${si}" data-field="reps" value="${set.reps ?? ''}" placeholder="—">
                  ${!isTest ? `<input class="set-input" type="number" step="0.5" min="1" max="10" inputmode="decimal" data-ex="${exIdx}" data-set="${si}" data-field="rpe" value="${set.rpe ?? ''}" placeholder="—">` : ''}
                  <button class="set-check ${set.done ? 'done' : ''}" data-action="toggle-set" data-ex="${exIdx}" data-set="${si}" data-rest="${def.rest || 0}" data-exname="${esc(libDef.name)}">${set.done ? '✓' : ''}</button>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
        <button class="cta" data-action="end-session">TERMINER LA SÉANCE</button>
      </div>
      ${timer.active ? `<div class="timer">
        <div class="timer-lbl">REPOS · ${esc(timer.exName)}</div>
        <div class="timer-num" id="timer-display">${fmtTime(timer.secLeft)}</div>
        <button class="timer-skip" data-action="skip-timer">passer</button>
      </div>` : ''}`;
    }

    // ============================================================
    // RENDER: EDITOR
    // ============================================================
    function renderEditor() {
      const weeks = programWeeks();
      if (weeks.length && (!state.openWeek || !weeks.find(w => w.id === state.openWeek))) {
        state.openWeek = weeks[0].id;
      }
      const current = weeks.find(w => w.id === state.openWeek);
      const cols = Math.min(weeks.length + 1, 6);

      return `<div class="pad">
        <div class="eyebrow">ÉDITEUR · sauvegarde auto</div>
        <div class="med-header">
          <div class="med-title">${esc(state.program.name || 'Programme sans nom')}</div>
          <button class="med-title-btn" data-action="rename-program" title="Renommer">✎</button>
        </div>

        ${weeks.length === 0 ? `
          <div class="empty" style="margin-top:32px;padding:40px 20px;">Aucune semaine.</div>
          <button class="cta" data-action="add-week">+ AJOUTER UNE SEMAINE</button>
        ` : `
          <div class="med-week-tabs" style="grid-template-columns: repeat(${cols}, 1fr);">
            ${weeks.map((w, i) => `<button class="med-week-tab ${w.id === state.openWeek ? 'active' : ''}" data-action="open-week" data-week="${w.id}">S${i+1}</button>`).join('')}
            <button class="med-week-tab med-week-tab-add" data-action="add-week" title="Ajouter une semaine">+</button>
          </div>
          ${current ? renderMobEdWeek(current) : ''}
        `}

        <div class="med-admin">
          <div class="med-admin-title">OPTIONS</div>
          <div class="med-admin-btns">
            <button class="med-admin-btn" data-action="open-library-edit">GÉRER LA BIBLIOTHÈQUE</button>
            <button class="med-admin-btn" data-action="import-program">IMPORTER UN PROGRAMME</button>
            <button class="med-admin-btn" data-action="export-program">EXPORTER (SAUVEGARDE)</button>
            <button class="med-admin-btn danger" data-action="reset-program">RESTAURER LE PEAK BLOCK PAR DÉFAUT</button>
          </div>
          <div class="med-admin-note">
            Éditeur bureau aussi disponible sur <b data-action="copy-editor-url" data-url="${esc(window.location.origin + '/editor.html')}">${esc(window.location.origin + '/editor.html')}</b> (tap pour copier).
          </div>
        </div>
      </div>`;
    }

    function renderMobEdWeek(w) {
      return `
        <div class="med-week-info">
          <div class="med-week-name-row">
            <div>
              <div class="med-week-badge">${esc(w.name).toUpperCase()}</div>
              <div class="med-week-meta">${w.days.length} séance${w.days.length > 1 ? 's' : ''}</div>
            </div>
          </div>
          <div class="med-week-actions">
            <button class="med-week-action-btn" data-action="rename-week" data-week="${w.id}">✎ Renommer</button>
            <button class="med-week-action-btn" data-action="duplicate-week" data-week="${w.id}">⧉ Dupliquer</button>
            <button class="med-week-action-btn danger" data-action="delete-week" data-week="${w.id}">× Supprimer</button>
          </div>
        </div>
        ${w.days.map(d => renderMobEdDay(w.id, d)).join('')}
        <button class="med-add-btn med-add-btn-lg" data-action="add-day" data-week="${w.id}">+ AJOUTER UN JOUR</button>
      `;
    }

    function renderMobEdDay(wId, d) {
      return `<div class="med-day">
        <div class="med-day-head">
          <div class="med-day-info">
            <div class="med-day-label">${esc(d.label)}${d.date ? ' · ' + fmtDateShort(d.date) : ''}${d.isTest ? ' · TEST' : ''}</div>
            <div class="med-day-name">${esc(d.name)}</div>
          </div>
          <div class="med-day-actions">
            <button class="med-icon-btn" data-action="edit-day" data-week="${wId}" data-day="${d.id}" title="Modifier">✎</button>
            <button class="med-icon-btn" data-action="duplicate-day" data-week="${wId}" data-day="${d.id}" title="Dupliquer">⧉</button>
            <button class="med-icon-btn danger" data-action="delete-day" data-week="${wId}" data-day="${d.id}" title="Supprimer">×</button>
          </div>
        </div>
        <div class="med-day-body">
          ${(d.ex || []).map((ex, i) => renderMobEdEx(wId, d.id, ex, i)).join('')}
          <button class="med-add-btn" data-action="add-exercise-to-day" data-week="${wId}" data-day="${d.id}">+ AJOUTER UN EXERCICE</button>
        </div>
      </div>`;
    }

    function renderMobEdEx(wId, dId, ex, i) {
      const def = getExDef(ex);
      const canInline = !ex.isTest;
      const extras = [];
      if (ex.rpe) extras.push(`RPE ${ex.rpe}`);
      if (ex.rest) extras.push(`repos ${ex.rest}s`);
      return `<div class="med-ex ${ex.main ? 'main-mark' : ''}">
        <div class="med-ex-line-1">
          <button class="med-ex-marker ${ex.main ? 'main' : ''}" data-action="edit-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="${ex.main ? 'Mouvement principal' : 'Accessoire'} · tap pour modifier">${ex.main ? '●' : '○'}</button>
          <span class="med-ex-name">${esc(def.name)}</span>
          <div class="med-ex-actions">
            ${canInline ? `<button class="med-icon-btn" data-action="edit-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="RPE, repos, note">✎</button>` : ''}
            <button class="med-icon-btn danger" data-action="delete-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Supprimer">×</button>
          </div>
        </div>
        ${canInline ? `
          <div class="med-ex-line-2">
            <input class="med-inline-input i-sets" type="number" inputmode="numeric" min="1" value="${ex.sets ?? ''}" data-inline="sets" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}">
            <span class="med-inline-sep">×</span>
            <input class="med-inline-input i-reps" type="text" inputmode="numeric" value="${esc(ex.reps ?? '')}" data-inline="reps" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}">
            <span class="med-inline-sep">@</span>
            <input class="med-inline-input i-weight" type="number" step="2.5" inputmode="decimal" value="${ex.weight ?? ''}" data-inline="weight" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" placeholder="—">
            <span class="med-inline-unit">kg</span>
          </div>
        ` : `<div class="med-ex-extras">${ex.overrides ? ex.overrides.length : ex.sets} étapes · non modifiable ici</div>`}
        ${extras.length ? `<div class="med-ex-extras">${esc(extras.join(' · '))}</div>` : ''}
        ${ex.note ? `<div class="med-ex-note">${esc(ex.note)}</div>` : ''}
      </div>`;
    }

    // ============================================================
    // RENDER: STATS
    // ============================================================
    function renderStats() {
      const completed = Object.entries(state.progress)
        .filter(([_, s]) => s.completed)
        .map(([k, s]) => ({ k, ...s }))
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      const total = programWeeks().reduce((a, w) => a + w.days.length, 0);
      const doneCount = completed.length;

      if (doneCount === 0) {
        return `<div class="pad">
          <div class="eyebrow">CYCLE EN COURS</div><h1>Statistiques</h1>
          <div class="empty">Termine ta première séance pour voir tes stats.</div>
        </div>`;
      }

      let totalT = 0;
      completed.forEach(s => s.exercises.forEach(e => e.sets.forEach(set => {
        if (set.done && set.weight && set.reps) totalT += set.weight * (parseInt(set.reps) || 0);
      })));

      const summary = `<div class="stats-summary">
        <div class="stat-box"><div class="stat-num">${doneCount}</div><div class="stat-lbl">séances · /${total}</div></div>
        <div class="stat-box"><div class="stat-num">${total ? Math.round(doneCount/total*100) : 0}%</div><div class="stat-lbl">complétion</div></div>
        <div class="stat-box"><div class="stat-num">${(totalT/1000).toFixed(1)}t</div><div class="stat-lbl">tonnage</div></div>
      </div>`;

      const mainGroups = ['squat', 'bench', 'deadlift', 'ohp'];
      const gLabels = { squat: 'SQUAT', bench: 'BENCH', deadlift: 'DEADLIFT', ohp: 'OHP' };
      const gColors = { squat: '#D4382F', bench: '#E5C547', deadlift: '#6FA85B', ohp: '#5BAFFF' };
      const e1rmHist = {};
      mainGroups.forEach(g => e1rmHist[g] = []);
      completed.forEach(s => {
        mainGroups.forEach(g => {
          let best = 0;
          s.exercises.forEach(e => {
            const def = getExDef(e);
            if (def.group !== g) return;
            e.sets.forEach(set => {
              if (set.done && set.weight && set.reps) {
                const v = e1rm(set.weight, parseInt(set.reps));
                if (v && v > best) best = v;
              }
            });
          });
          if (best > 0) e1rmHist[g].push({ date: s.date, value: best });
        });
      });

      const e1rmCards = mainGroups.map(g => {
        const data = e1rmHist[g];
        if (!data.length) return `<div class="e1rm-card"><div class="e1rm-name">${gLabels[g]}</div><div class="e1rm-val">—</div><div class="e1rm-trend">aucune donnée</div></div>`;
        const cur = data[data.length - 1].value;
        const first = data[0].value;
        const delta = cur - first;
        const cls = delta > 0 ? 'up' : '';
        const trend = data.length > 1 ? (delta > 0 ? `+${delta.toFixed(1)} kg` : `${delta.toFixed(1)} kg`) : 'départ';
        return `<div class="e1rm-card"><div class="e1rm-name">${gLabels[g]}</div><div class="e1rm-val">${cur.toFixed(1)} kg</div><div class="e1rm-trend ${cls}">${trend}</div></div>`;
      }).join('');

      const allDates = [...new Set(completed.map(s => s.date).filter(Boolean))].sort();
      let e1rmChart = '';
      if (allDates.length > 1) {
        const W = 320, H = 200, pad = { l: 35, r: 8, t: 14, b: 30 };
        const iW = W - pad.l - pad.r, iH = H - pad.t - pad.b;
        const allV = mainGroups.flatMap(g => e1rmHist[g].map(d => d.value));
        if (allV.length) {
          const maxV = Math.max(...allV), minV = Math.min(...allV);
          const range = maxV - minV || 1;
          const yMax = maxV + range * 0.1, yMin = Math.max(0, minV - range * 0.1);
          const yRange = yMax - yMin || 1;
          const yPx = v => pad.t + iH - ((v - yMin) / yRange) * iH;
          const xPx = i => pad.l + (allDates.length === 1 ? iW / 2 : (i / (allDates.length - 1)) * iW);

          const lines = mainGroups.map(g => {
            const pts = e1rmHist[g].map(d => ({ x: xPx(allDates.indexOf(d.date)), y: yPx(d.value) }));
            if (!pts.length) return '';
            const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
            return `<path d="${path}" stroke="${gColors[g]}" stroke-width="2" fill="none"/>${pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${gColors[g]}"/>`).join('')}`;
          }).join('');

          const ticks = [0, 0.5, 1].map(t => {
            const v = yMin + yRange * t, y = yPx(v);
            return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"/><text class="axis-lbl" x="${pad.l - 4}" y="${y + 3}" text-anchor="end">${Math.round(v)}</text>`;
          }).join('');

          const legend = mainGroups.map((g, i) => `<g transform="translate(${pad.l + i * 70}, ${H - 8})"><rect x="0" y="-7" width="10" height="2" fill="${gColors[g]}"/><text class="axis-lbl" x="14" y="-2">${gLabels[g].substring(0, 4)}</text></g>`).join('');

          e1rmChart = `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${ticks}${lines}${legend}</svg></div>`;
        }
      }

      // Weekly tonnage
      const wTon = {};
      completed.forEach(s => {
        const parts = s.k.split('::');
        const w = findWeekById(parts[0]);
        if (!w) return;
        const idx = programWeeks().indexOf(w) + 1;
        if (!wTon[idx]) wTon[idx] = 0;
        s.exercises.forEach(e => e.sets.forEach(set => {
          if (set.done && set.weight && set.reps) wTon[idx] += set.weight * (parseInt(set.reps) || 0);
        }));
      });
      const tData = Object.entries(wTon).map(([w, v]) => ({ label: 'S' + w, value: Math.round(v / 100) / 10 }));
      let tChart = '';
      if (tData.length) {
        const W = 320, H = 160, pad = { l: 28, r: 8, t: 10, b: 24 };
        const maxV = Math.max(...tData.map(d => d.value), 0.1);
        const iH = H - pad.t - pad.b, iW = W - pad.l - pad.r;
        const bW = iW / tData.length * 0.7, bG = iW / tData.length * 0.3;
        tChart = `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}">
          ${[0, 0.5, 1].map(t => { const y = pad.t + iH * (1 - t); return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"/><text class="axis-lbl" x="${pad.l - 4}" y="${y + 3}" text-anchor="end">${(maxV * t).toFixed(1)}</text>`; }).join('')}
          ${tData.map((d, i) => { const x = pad.l + i * (bW + bG) + bG / 2; const h = maxV > 0 ? (d.value / maxV) * iH : 0; const y = pad.t + iH - h; return `<rect class="bar-fill" x="${x}" y="${y}" width="${bW}" height="${h}"/><text class="axis-lbl" x="${x + bW / 2}" y="${H - pad.b + 12}" text-anchor="middle">${d.label}</text>`; }).join('')}
        </svg></div>`;
      }

      // RPE distribution
      const rC = {};
      completed.forEach(s => s.exercises.forEach(e => e.sets.forEach(set => {
        if (set.done && set.rpe) { const r = Math.round(set.rpe * 2) / 2; rC[r] = (rC[r] || 0) + 1; }
      })));
      const rData = Object.entries(rC).map(([r, c]) => ({ label: r, value: c })).sort((a, b) => parseFloat(a.label) - parseFloat(b.label));
      let rChart = '';
      if (rData.length) {
        const W = 320, H = 140, pad = { l: 28, r: 8, t: 10, b: 24 };
        const maxV = Math.max(...rData.map(d => d.value));
        const iH = H - pad.t - pad.b, iW = W - pad.l - pad.r;
        const bW = iW / rData.length * 0.7, bG = iW / rData.length * 0.3;
        rChart = `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}">
          ${[0, 1].map(t => { const y = pad.t + iH * (1 - t); return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"/><text class="axis-lbl" x="${pad.l - 4}" y="${y + 3}" text-anchor="end">${Math.round(maxV * t)}</text>`; }).join('')}
          ${rData.map((d, i) => { const x = pad.l + i * (bW + bG) + bG / 2; const h = (d.value / maxV) * iH; const y = pad.t + iH - h; return `<rect class="bar-fill" x="${x}" y="${y}" width="${bW}" height="${h}"/><text class="axis-lbl" x="${x + bW / 2}" y="${H - pad.b + 12}" text-anchor="middle">${d.label}</text>`; }).join('')}
        </svg></div>`;
      }

      // Compliance
      const comp = programWeeks().map((w, i) => {
        const t = w.days.length;
        const dn = w.days.filter(d => state.progress[sessionKey(w.id, d.id)]?.completed).length;
        return { week: i + 1, done: dn, total: t, pct: t ? dn / t * 100 : 0 };
      });
      const compRows = comp.map(c => `<div class="compliance-row"><span class="compliance-week">S${c.week}</span><div class="compliance-bar-wrap"><div class="compliance-bar-fill" style="width:${c.pct}%"></div></div><span class="compliance-val">${c.done}/${c.total}</span></div>`).join('');

      // BW
      const bwD = Object.entries(state.bw).sort().map(([d, v]) => ({ date: d, value: v }));
      let bwBlock = '';
      if (bwD.length >= 2) {
        const W = 320, H = 140, pad = { l: 32, r: 8, t: 10, b: 22 };
        const iH = H - pad.t - pad.b, iW = W - pad.l - pad.r;
        const vals = bwD.map(d => d.value);
        const maxV = Math.max(...vals), minV = Math.min(...vals);
        const range = maxV - minV || 1;
        const yMax = maxV + range * 0.2, yMin = minV - range * 0.2;
        const yRange = yMax - yMin || 1;
        const pts = bwD.map((d, i) => ({ x: pad.l + (bwD.length === 1 ? iW / 2 : (i / (bwD.length - 1)) * iW), y: pad.t + iH - ((d.value - yMin) / yRange) * iH }));
        const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
        bwBlock = `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}">
          ${[0, 0.5, 1].map(t => { const v = yMin + yRange * t; const y = pad.t + iH * (1 - t); return `<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"/><text class="axis-lbl" x="${pad.l - 4}" y="${y + 3}" text-anchor="end">${v.toFixed(1)}</text>`; }).join('')}
          <path d="${path}" stroke="#E5C547" stroke-width="2" fill="none"/>${pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#E5C547"/>`).join('')}
        </svg></div>`;
      }

      return `<div class="pad">
        <div class="eyebrow">CYCLE EN COURS</div><h1>Statistiques</h1>
        ${summary}
        <div class="stat-section"><div class="stat-section-head">e1RM ESTIMÉ · DERNIÈRE VALEUR</div><div class="e1rm-grid">${e1rmCards}</div>${e1rmChart ? `<div style="margin-top:12px;">${e1rmChart}</div>` : ''}</div>
        <div class="stat-section"><div class="stat-section-head">TONNAGE PAR SEMAINE (t)</div>${tChart || '<div class="empty">Pas encore de données</div>'}</div>
        <div class="stat-section"><div class="stat-section-head">DISTRIBUTION DES RPE</div>${rChart || '<div class="empty">Note tes RPE pour voir la distribution</div>'}</div>
        <div class="stat-section"><div class="stat-section-head">RÉGULARITÉ PAR SEMAINE</div>${compRows}</div>
        ${bwBlock ? `<div class="stat-section"><div class="stat-section-head">POIDS DE CORPS</div>${bwBlock}</div>` : ''}
        <button class="reset-btn" data-action="reset-progress">RÉINITIALISER LA PROGRESSION</button>
      </div>`;
    }

    // ============================================================
    // RENDER: MODAL
    // ============================================================
    function renderModal() {
      if (!state.modal) return '';
      const m = state.modal;
      if (m.type === 'edit-exercise') {
        const ex = m.data.exercise;
        const def = getExDef(ex);
        return modalWrap(def.name, 'Séries, reps et charge se modifient sur la ligne. Ici : RPE, repos, note, mouvement principal.', `
          <div class="modal-field"><label class="modal-label">RPE</label><input class="modal-input" id="m-rpe" type="number" step="0.5" min="1" max="10" inputmode="decimal" value="${ex.rpe ?? ''}" placeholder="optionnel"></div>
          <div class="modal-field"><label class="modal-label">REPOS (secondes)</label><input class="modal-input" id="m-rest" type="number" inputmode="numeric" value="${ex.rest ?? 60}"></div>
          <div class="modal-field"><label class="modal-label">NOTE</label><textarea class="modal-input textarea text-normal" id="m-note" placeholder="ex. ~32,5 kg/main, semi-pronation">${esc(ex.note || '')}</textarea></div>
          <div class="modal-check-row" data-action="toggle-main"><div class="modal-check ${ex.main ? 'checked' : ''}" id="m-main-check">${ex.main ? '✓' : ''}</div><span class="modal-check-lbl">Mouvement principal</span></div>
        `, [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Enregistrer', cls: 'confirm', action: 'save-exercise' },
        ]);
      }
      if (m.type === 'edit-day') {
        const d = m.data.day;
        return modalWrap('Modifier la séance', '', `
          <div class="modal-field"><label class="modal-label">LIBELLÉ (jour)</label><input class="modal-input text-normal" id="m-label" type="text" value="${esc(d.label || '')}" placeholder="ex. Lundi"></div>
          <div class="modal-field"><label class="modal-label">NOM DE LA SÉANCE</label><input class="modal-input text-normal" id="m-name" type="text" value="${esc(d.name || '')}" placeholder="ex. Squat + OHP"></div>
          <div class="modal-field"><label class="modal-label">DATE (optionnel)</label><input class="modal-input" id="m-date" type="date" value="${esc(d.date || '')}"></div>
        `, [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'OK', cls: 'confirm', action: 'save-day' },
        ]);
      }
      if (m.type === 'edit-lib-exercise') {
        const ex = m.data.libEx;
        const isNew = m.data.isNew;
        return modalWrap(isNew ? 'Nouvel exercice' : 'Modifier exercice', '', `
          <div class="modal-field"><label class="modal-label">NOM</label><input class="modal-input text-normal" id="m-name" type="text" value="${esc(ex.name || '')}"></div>
          <div class="modal-field"><label class="modal-label">GROUPE</label>
            <select class="modal-input text-normal" id="m-group">
              ${GROUPS.map(g => `<option value="${g}"${ex.group === g ? ' selected' : ''}>${GROUP_LABELS[g]}</option>`).join('')}
            </select>
          </div>
          <div class="modal-field"><label class="modal-label">REPOS PAR DÉFAUT (sec)</label><input class="modal-input" id="m-rest" type="number" inputmode="numeric" value="${ex.restDefault ?? 60}"></div>
        `, [
          ...(isNew ? [] : [{ label: 'Supprimer', cls: 'danger', action: 'delete-lib-exercise' }]),
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'OK', cls: 'confirm', action: 'save-lib-exercise' },
        ]);
      }
      if (m.type === 'pick-exercise') {
        const items = Object.values(state.library).sort((a, b) => a.name.localeCompare(b.name));
        return modalWrap('Choisir un exercice', 'Tape pour ajouter à la séance', `
          <div class="lib-picker-list">
            ${items.map(ex => `<div class="lib-picker-item" data-action="pick-exercise-confirm" data-lib-id="${ex.id}">
              <div><div class="lib-picker-name">${esc(ex.name)}</div></div>
              <div class="lib-picker-meta">${esc(GROUP_LABELS[ex.group] || ex.group)}</div>
            </div>`).join('')}
          </div>
        `, [{ label: 'Annuler', cls: 'cancel', action: 'close-modal' }]);
      }
      if (m.type === 'library-manager') {
        const items = Object.values(state.library).sort((a, b) => (a.group + a.name).localeCompare(b.group + b.name));
        return modalWrap('Bibliothèque', `${items.length} exercices`, `
          <button class="editor-tool-btn primary" style="width:100%;margin-bottom:10px;padding:10px;" data-action="add-lib-exercise">+ NOUVEL EXERCICE</button>
          <div class="lib-list-editor">
            ${items.map(ex => `<div class="lib-item-full">
              <div style="flex:1;min-width:0;">
                <div class="lib-picker-name">${esc(ex.name)}</div>
                <div class="lib-picker-meta">${esc(GROUP_LABELS[ex.group] || ex.group)} · ${ex.restDefault}s</div>
              </div>
              <button class="ed-icon-btn" data-action="edit-lib-exercise" data-lib-id="${ex.id}">✎</button>
            </div>`).join('')}
          </div>
        `, [{ label: 'Fermer', cls: 'cancel', action: 'close-modal' }]);
      }
      if (m.type === 'import') {
        return modalWrap('Importer un programme', 'Colle un export JSON ci-dessous', `
          <div class="modal-field"><textarea class="modal-input textarea text-normal" id="m-json" placeholder="{ ... }" style="min-height:120px;"></textarea></div>
        `, [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Importer', cls: 'confirm', action: 'do-import' },
        ]);
      }
      if (m.type === 'export') {
        const data = JSON.stringify({ program: state.program, library: state.library }, null, 2);
        return modalWrap('Export du programme', 'Copie et sauvegarde ce texte', `
          <div class="modal-field"><textarea class="modal-input textarea text-normal" readonly style="min-height:200px;font-family:ui-monospace,monospace;font-size:11px;">${esc(data)}</textarea></div>
        `, [{ label: 'Fermer', cls: 'cancel', action: 'close-modal' }]);
      }
      return '';
    }

    function modalWrap(title, subtitle, body, actions) {
      return `<div class="modal-overlay" data-action="close-modal-bg">
        <div class="modal">
          <div class="modal-title">${esc(title)}</div>
          ${subtitle ? `<div class="modal-subtitle">${esc(subtitle)}</div>` : ''}
          ${body}
          <div class="modal-actions">
            ${actions.map(a => `<button class="modal-btn ${a.cls}" data-action="${a.action}">${esc(a.label)}</button>`).join('')}
          </div>
        </div>
      </div>`;
    }

    // ============================================================
    // NAV + RENDER
    // ============================================================
    function renderNav() {
      if (state.view === 'session') return '';
      const t = (v, i, l) => `<button class="tab-btn ${state.view === v ? 'active' : ''}" data-action="nav" data-view="${v}"><div class="tab-icon">${i}</div><div class="tab-label">${l}</div></button>`;
      return `<nav class="nav">
        ${t('today', '◉', 'Aujourd\'hui')}
        ${t('program', '≡', 'Programme')}
        ${t('editor', '✎', 'Éditeur')}
      </nav>`;
    }

    function render() {
      const app = document.getElementById('app');
      let c = '';
      if (state.view === 'today') c = renderToday();
      else if (state.view === 'program') c = renderProgram();
      else if (state.view === 'session') c = renderSession();
      else if (state.view === 'editor') c = renderEditor();
      else if (state.view === 'stats') c = renderStats();

      const modalHtml = renderModal();
      app.innerHTML = `<div class="anim-${nextAnim}" id="app-content">${c}</div>${renderNav()}${modalHtml}`;
      nextAnim = 'fade';

      if (lastToggle) {
        setTimeout(() => {
          const btn = document.querySelector(`[data-action="toggle-set"][data-ex="${lastToggle.ex}"][data-set="${lastToggle.set}"]`);
          if (btn) { btn.classList.add('just-checked'); setTimeout(() => btn.classList.remove('just-checked'), 320); }
        }, 0);
        lastToggle = null;
      }
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    function setView(v) {
      const old = state.view;
      if (old !== 'session' && v === 'session') nextAnim = 'slide-up';
      else if (old === 'session' && v !== 'session') nextAnim = 'slide-down';
      else nextAnim = 'fade';
      state.view = v;
      render();
    }

    function startSession(weekId, dayId) {
      const w = findWeekById(weekId), d = findDayById(weekId, dayId);
      if (!w || !d) return;
      const k = sessionKey(weekId, dayId);
      if (state.progress[k]) {
        state.sessionData = state.progress[k];
      } else {
        state.sessionData = {
          completed: false,
          date: d.date || todayKey(),
          exercises: (d.ex || []).map(e => ({
            libId: e.libId,
            name: e.libId ? undefined : e.name,
            sets: e.overrides
              ? e.overrides.map(o => ({ done: false, weight: o.weight, reps: o.reps, rpe: null, label: o.label }))
              : Array(e.sets).fill(null).map(() => ({ done: false, weight: e.weight ?? null, reps: e.reps, rpe: null })),
          })),
        };
      }
      state.activeSession = { weekId, dayId };
      setView('session');
    }

    function endSession() {
      const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
      state.sessionData.completed = true;
      state.sessionData.endTime = new Date().toISOString();
      state.progress[k] = state.sessionData;
      saveProgress();
      state.activeSession = null; state.sessionData = null;
      stopTimer();
      setView('today');
    }

    function backToToday() {
      if (state.sessionData && state.activeSession) {
        const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
        if (state.sessionData.exercises.some(e => e.sets.some(s => s.done))) {
          state.progress[k] = state.sessionData;
          saveProgress();
        }
      }
      state.activeSession = null; state.sessionData = null;
      stopTimer();
      setView('today');
    }

    function toggleSet(exIdx, setIdx, restSec, exName) {
      const set = state.sessionData.exercises[exIdx].sets[setIdx];
      set.done = !set.done;
      const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
      state.progress[k] = state.sessionData;
      saveProgress();
      if (set.done) {
        lastToggle = { ex: exIdx, set: setIdx };
        if (navigator.vibrate) navigator.vibrate(15);
        if (restSec > 0) startTimer(restSec, exName);
      }
      render();
    }

    function updateSet(exIdx, setIdx, field, value) {
      const set = state.sessionData.exercises[exIdx].sets[setIdx];
      if (field === 'weight' || field === 'rpe') set[field] = value ? parseFloat(value) : null;
      else set[field] = value;
      const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
      state.progress[k] = state.sessionData;
      saveProgress();
    }

    function startTimer(sec, exName) {
      stopTimer();
      timer.secLeft = sec; timer.exName = exName; timer.active = true;
      timer.interval = setInterval(() => {
        timer.secLeft--;
        if (timer.secLeft <= 0) { stopTimer(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); render(); }
        else { const el = document.getElementById('timer-display'); if (el) el.textContent = fmtTime(timer.secLeft); }
      }, 1000);
    }
    function stopTimer() { if (timer.interval) clearInterval(timer.interval); timer.interval = null; timer.active = false; timer.secLeft = 0; }

    function resetProgress() {
      if (confirm('Effacer toute la progression (séances, BW, état) ?')) {
        state.progress = {}; state.bw = {}; state.readiness = {};
        saveProgress(); saveBw(); saveReadiness();
        setView('today');
      }
    }

    function editBw() {
      const cur = getTodayBw();
      const v = prompt('Poids de corps aujourd\'hui (kg) :', cur !== null ? cur : '');
      if (v === null || v === '') return;
      const n = parseFloat(String(v).replace(',', '.'));
      if (!isNaN(n) && n > 0 && n < 300) { state.bw[todayKey()] = n; saveBw(); render(); }
    }

    function setReadiness(emoji) {
      const tk = todayKey();
      if (state.readiness[tk] === emoji) delete state.readiness[tk];
      else state.readiness[tk] = emoji;
      saveReadiness();
      if (navigator.vibrate) navigator.vibrate(10);
      render();
    }

    // === Editor actions ===
    function addWeek() {
      const num = programWeeks().length + 1;
      const w = { id: uid('w'), name: `Semaine ${num}`, days: [] };
      state.program.weeks.push(w);
      state.editorExpandedWeeks[w.id] = true;
      state.openWeek = w.id;
      saveProgram(); render();
    }
    function renameWeek(weekId) {
      const w = findWeekById(weekId);
      if (!w) return;
      const v = prompt('Nom de la semaine :', w.name);
      if (v && v.trim()) { w.name = v.trim(); saveProgram(); render(); }
    }
    function deleteWeek(weekId) {
      const w = findWeekById(weekId); if (!w) return;
      if (!confirm(`Supprimer la semaine "${w.name}" et ses ${w.days.length} séance${w.days.length > 1 ? 's' : ''} ?`)) return;
      state.program.weeks = programWeeks().filter(x => x.id !== weekId);
      if (state.openWeek === weekId) state.openWeek = programWeeks()[0]?.id || null;
      saveProgram(); render();
    }
    function duplicateWeek(weekId) {
      const w = findWeekById(weekId); if (!w) return;
      const copy = JSON.parse(JSON.stringify(w));
      copy.id = uid('w');
      copy.name = w.name + ' (copie)';
      copy.days.forEach(d => { d.id = uid('d'); });
      const idx = programWeeks().indexOf(w);
      state.program.weeks.splice(idx + 1, 0, copy);
      state.openWeek = copy.id;
      saveProgram(); render();
    }
    function toggleWeekExpanded(weekId) {
      state.editorExpandedWeeks[weekId] = !(state.editorExpandedWeeks[weekId] !== false);
      render();
    }
    function addDay(weekId) {
      const w = findWeekById(weekId);
      if (!w) return;
      const d = { id: uid('d'), label: 'Jour', name: 'Nouvelle séance', date: '', ex: [] };
      w.days.push(d);
      state.modal = { type: 'edit-day', data: { weekId, day: d, isNew: true } };
      saveProgram(); render();
    }
    function duplicateDay(weekId, dayId) {
      const w = findWeekById(weekId); const d = findDayById(weekId, dayId);
      if (!w || !d) return;
      const copy = JSON.parse(JSON.stringify(d));
      copy.id = uid('d');
      copy.name = d.name + ' (copie)';
      const idx = w.days.indexOf(d);
      w.days.splice(idx + 1, 0, copy);
      saveProgram(); render();
    }
    function editDay(weekId, dayId) {
      const d = findDayById(weekId, dayId);
      if (!d) return;
      state.modal = { type: 'edit-day', data: { weekId, day: d } };
      render();
    }
    function saveDay() {
      const d = state.modal.data.day;
      d.label = document.getElementById('m-label').value.trim();
      d.name = document.getElementById('m-name').value.trim();
      d.date = document.getElementById('m-date').value || '';
      state.modal = null;
      saveProgram(); render();
    }
    function deleteDay(weekId, dayId) {
      const d = findDayById(weekId, dayId); if (!d) return;
      if (!confirm(`Supprimer la séance "${d.name}" ?`)) return;
      const w = findWeekById(weekId);
      if (w) { w.days = w.days.filter(x => x.id !== dayId); saveProgram(); render(); }
    }
    function editExercise(weekId, dayId, exIdx) {
      const d = findDayById(weekId, dayId);
      if (!d) return;
      const ex = d.ex[exIdx];
      state.modal = { type: 'edit-exercise', data: { weekId, dayId, exIdx, exercise: JSON.parse(JSON.stringify(ex)) } };
      render();
    }
    function saveExercise() {
      const { weekId, dayId, exIdx } = state.modal.data;
      const d = findDayById(weekId, dayId);
      if (!d) return;
      const target = d.ex[exIdx];
      const rV = document.getElementById('m-rpe').value;
      const restV = parseInt(document.getElementById('m-rest').value);
      const noteV = document.getElementById('m-note').value.trim();
      target.rpe = rV ? parseFloat(rV) : null;
      target.rest = isNaN(restV) ? 60 : restV;
      if (noteV) target.note = noteV; else delete target.note;
      target.main = state.modal.data.exercise.main;
      state.modal = null;
      saveProgram(); render();
    }
    function toggleMain() {
      state.modal.data.exercise.main = !state.modal.data.exercise.main;
      render();
    }
    function deleteExerciseFromDay(weekId, dayId, exIdx) {
      const d = findDayById(weekId, dayId); if (!d) return;
      const ex = d.ex[exIdx]; if (!ex) return;
      const def = getExDef(ex);
      if (!confirm(`Retirer "${def.name}" de cette séance ?`)) return;
      d.ex.splice(exIdx, 1); saveProgram(); render();
    }
    function openExercisePicker(weekId, dayId) {
      state.modal = { type: 'pick-exercise', data: { weekId, dayId } };
      render();
    }
    function pickExerciseConfirm(libId) {
      const { weekId, dayId } = state.modal.data;
      addExerciseToDay(weekId, dayId, libId);
      state.modal = null;
      render();
    }
    function addExerciseToDay(weekId, dayId, libId) {
      const d = findDayById(weekId, dayId);
      const lib = getLibEx(libId);
      if (!d || !lib) return;
      d.ex.push({ libId, sets: 3, reps: 8, weight: null, rpe: null, rest: lib.restDefault || 60, main: false });
      saveProgram();
    }
    function filterLibrary(v) { state.editorLibraryFilter = v; render(); }
    function openLibraryManager() { state.modal = { type: 'library-manager' }; render(); }
    function addLibExercise() {
      const ex = { id: uid('ex'), name: '', group: 'other', restDefault: 60 };
      state.modal = { type: 'edit-lib-exercise', data: { libEx: ex, isNew: true } };
      render();
    }
    function editLibExercise(libId) {
      const ex = getLibEx(libId);
      if (!ex) return;
      state.modal = { type: 'edit-lib-exercise', data: { libEx: JSON.parse(JSON.stringify(ex)), isNew: false } };
      render();
    }
    function saveLibExercise() {
      const ex = state.modal.data.libEx;
      ex.name = document.getElementById('m-name').value.trim();
      ex.group = document.getElementById('m-group').value;
      ex.restDefault = parseInt(document.getElementById('m-rest').value) || 60;
      if (!ex.name) { alert('Nom requis'); return; }
      state.library[ex.id] = ex;
      saveLibrary();
      state.modal = { type: 'library-manager' };
      render();
    }
    function deleteLibExercise() {
      const ex = state.modal.data.libEx;
      if (!confirm(`Supprimer "${ex.name}" ? Cet exercice ne sera plus disponible mais les séances existantes le garderont.`)) return;
      delete state.library[ex.id];
      saveLibrary();
      state.modal = { type: 'library-manager' };
      render();
    }
    function renameProgram() {
      const v = prompt('Nom du programme :', state.program.name || '');
      if (v !== null) { state.program.name = v.trim(); saveProgram(); render(); }
    }
    function exportProgram() { state.modal = { type: 'export' }; render(); }
    function importProgram() { state.modal = { type: 'import' }; render(); }
    function doImport() {
      const raw = document.getElementById('m-json').value.trim();
      try {
        const parsed = JSON.parse(raw);
        if (parsed.program && parsed.library) {
          if (!confirm('Remplacer le programme et la bibliothèque actuels ?')) return;
          state.program = parsed.program; state.library = parsed.library;
          saveProgram(); saveLibrary();
          state.modal = null; render();
        } else { alert('Format invalide : besoin de {program, library}'); }
      } catch (e) { alert('JSON invalide'); }
    }
    function resetToDefaultProgram() {
      if (!confirm('Remplacer le programme actuel par le peak block par défaut ? La bibliothèque sera fusionnée.')) return;
      state.program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
      Object.assign(state.library, DEFAULT_LIBRARY);
      saveProgram(); saveLibrary();
      render();
    }
    function closeModal() { state.modal = null; render(); }

    // ============================================================
    // DRAG & DROP (long-press activation)
    // ============================================================
    let pressState = null, dragState = null;

    function initDragDrop() {
      document.addEventListener('pointerdown', onPointerDown);
    }

    function onPointerDown(e) {
      if (dragState || state.view !== 'editor') return;
      const item = e.target.closest('[data-drag-type]');
      if (!item) return;
      pressState = {
        element: item, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId,
        timer: setTimeout(() => {
          if (!pressState) return;
          startDrag(pressState.element, pressState.startX, pressState.startY);
          pressState = null;
        }, 250),
      };
      const abort = () => {
        if (pressState) { clearTimeout(pressState.timer); pressState = null; }
        document.removeEventListener('pointermove', onPreMove);
        document.removeEventListener('pointerup', abort);
        document.removeEventListener('pointercancel', abort);
      };
      const onPreMove = (e2) => {
        if (!pressState) return;
        const dx = e2.clientX - pressState.startX, dy = e2.clientY - pressState.startY;
        if (Math.sqrt(dx*dx + dy*dy) > 10) abort();
      };
      document.addEventListener('pointermove', onPreMove, { passive: true });
      document.addEventListener('pointerup', abort);
      document.addEventListener('pointercancel', abort);
    }

    function startDrag(element, startX, startY) {
      if (navigator.vibrate) navigator.vibrate(20);
      const rect = element.getBoundingClientRect();
      const ghost = element.cloneNode(true);
      ghost.style.position = 'fixed';
      ghost.style.top = rect.top + 'px';
      ghost.style.left = rect.left + 'px';
      ghost.style.width = rect.width + 'px';
      ghost.style.pointerEvents = 'none';
      ghost.style.opacity = '0.9';
      ghost.style.transform = 'scale(1.03)';
      ghost.classList.add('dragging-ghost');
      document.body.appendChild(ghost);
      element.classList.add('dragging');
      dragState = {
        element, ghost,
        offsetX: startX - rect.left, offsetY: startY - rect.top,
        data: { ...element.dataset },
      };
      document.body.style.overflow = 'hidden';
      document.body.style.touchAction = 'none';
      document.addEventListener('pointermove', onDragMove, { passive: false });
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragEnd);
    }

    function onDragMove(e) {
      if (!dragState) return;
      e.preventDefault();
      dragState.ghost.style.top = (e.clientY - dragState.offsetY) + 'px';
      dragState.ghost.style.left = (e.clientX - dragState.offsetX) + 'px';
      dragState.ghost.style.display = 'none';
      const t = document.elementFromPoint(e.clientX, e.clientY);
      dragState.ghost.style.display = '';
      const dz = t?.closest('[data-drop-zone]');
      document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
      if (dz) dz.classList.add('drop-hover');
    }

    function onDragEnd(e) {
      if (!dragState) return;
      dragState.ghost.style.display = 'none';
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const dz = t?.closest('[data-drop-zone]');
      if (dz) handleDrop(dragState.data, dz.dataset);
      dragState.ghost.remove();
      dragState.element.classList.remove('dragging');
      document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
      document.body.style.overflow = '';
      document.body.style.touchAction = '';
      document.removeEventListener('pointermove', onDragMove);
      document.removeEventListener('pointerup', onDragEnd);
      document.removeEventListener('pointercancel', onDragEnd);
      dragState = null;
      render();
    }

    function handleDrop(drag, drop) {
      if (drop.dropZone === 'day') {
        if (drag.dragType === 'library' && drag.libId) {
          addExerciseToDay(drop.week, drop.day, drag.libId);
        } else if (drag.dragType === 'program' && drag.exIdx !== undefined) {
          // Move exercise from source day to target day
          const srcDay = findDayById(drag.week, drag.day);
          const tgtDay = findDayById(drop.week, drop.day);
          if (srcDay && tgtDay) {
            const [moved] = srcDay.ex.splice(parseInt(drag.exIdx), 1);
            tgtDay.ex.push(moved);
            saveProgram();
          }
        }
      }
    }

    // ============================================================
    // EVENT DELEGATION
    // ============================================================
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const a = btn.dataset.action;
      const w = btn.dataset.week, d = btn.dataset.day, ei = btn.dataset.exIdx;

      // Close modal only if user clicked directly on the overlay
      if (a === 'close-modal-bg') { if (e.target === btn) closeModal(); return; }

      if (a === 'nav') setView(btn.dataset.view);
      else if (a === 'start-session') startSession(w, d);
      else if (a === 'open-week') { state.openWeek = w; render(); }
      else if (a === 'back-to-today') backToToday();
      else if (a === 'toggle-set') toggleSet(+btn.dataset.ex, +btn.dataset.set, +btn.dataset.rest, btn.dataset.exname);
      else if (a === 'end-session') endSession();
      else if (a === 'skip-timer') { stopTimer(); render(); }
      else if (a === 'reset-progress') resetProgress();
      else if (a === 'edit-bw') editBw();
      else if (a === 'set-readiness') setReadiness(btn.dataset.emoji);
      // Editor
      else if (a === 'add-week') addWeek();
      else if (a === 'rename-week') renameWeek(w);
      else if (a === 'delete-week') deleteWeek(w);
      else if (a === 'duplicate-week') duplicateWeek(w);
      else if (a === 'toggle-week') toggleWeekExpanded(w);
      else if (a === 'open-week') { state.openWeek = w; render(); }
      else if (a === 'add-day') addDay(w);
      else if (a === 'edit-day') editDay(w, d);
      else if (a === 'duplicate-day') duplicateDay(w, d);
      else if (a === 'save-day') saveDay();
      else if (a === 'delete-day') deleteDay(w, d);
      else if (a === 'edit-exercise') editExercise(w, d, +ei);
      else if (a === 'save-exercise') saveExercise();
      else if (a === 'toggle-main') toggleMain();
      else if (a === 'delete-exercise') deleteExerciseFromDay(w, d, +ei);
      else if (a === 'add-exercise-to-day') openExercisePicker(w, d);
      else if (a === 'pick-exercise-confirm') pickExerciseConfirm(btn.dataset.libId);
      else if (a === 'open-library-edit') openLibraryManager();
      else if (a === 'add-lib-exercise') addLibExercise();
      else if (a === 'edit-lib-exercise') editLibExercise(btn.dataset.libId);
      else if (a === 'save-lib-exercise') saveLibExercise();
      else if (a === 'delete-lib-exercise') deleteLibExercise();
      else if (a === 'rename-program') renameProgram();
      else if (a === 'export-program') exportProgram();
      else if (a === 'import-program') importProgram();
      else if (a === 'do-import') doImport();
      else if (a === 'reset-program') resetToDefaultProgram();
      else if (a === 'close-modal') closeModal();
      else if (a === 'copy-editor-url') {
        const url = btn.dataset.url;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            const old = btn.textContent; btn.textContent = '✓ copié !';
            setTimeout(() => btn.textContent = old, 1500);
          }).catch(() => { alert('URL : ' + url); });
        } else { alert('URL : ' + url); }
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.matches('[data-action="filter-library"]')) filterLibrary(e.target.value);
      // Inline edit on editor view: sets, reps, weight
      const inp = e.target;
      if (inp.dataset && inp.dataset.inline && state.view === 'editor') {
        const w = inp.dataset.week, d = inp.dataset.day, i = parseInt(inp.dataset.exIdx);
        const day = findDayById(w, d);
        if (!day || !day.ex[i]) return;
        const ex = day.ex[i];
        const f = inp.dataset.inline;
        if (f === 'sets') { const n = parseInt(inp.value); ex.sets = (isNaN(n) || n < 1) ? 1 : n; }
        else if (f === 'reps') { ex.reps = inp.value.trim(); }
        else if (f === 'weight') { ex.weight = inp.value === '' ? null : parseFloat(inp.value); }
        saveProgram();
        // no re-render to preserve focus
      }
    });

    document.addEventListener('input', (e) => {
      const inp = e.target;
      if (inp.dataset.field && state.view === 'session') {
        updateSet(+inp.dataset.ex, +inp.dataset.set, inp.dataset.field, inp.value);
      }
    });

    // ============================================================
    // INIT
    // ============================================================
    loadAll();
    // Seed defaults if empty
    let seeded = false;
    if (!state.library || Object.keys(state.library).length === 0) {
      state.library = JSON.parse(JSON.stringify(DEFAULT_LIBRARY));
      seeded = true;
    }
    if (!state.program || !state.program.weeks || state.program.weeks.length === 0) {
      state.program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
      seeded = true;
    }
    if (seeded) { saveLibrary(); saveProgram(); }
    initDragDrop();
    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
