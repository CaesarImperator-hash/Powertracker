<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>PL Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PL Tracker">
  <meta name="theme-color" content="#0A0A0C">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg-1: #0A0A0C; --bg-2: #131316; --bg-3: #1C1C21;
      --border-1: #25252B; --border-2: #3A3A42;
      --accent: #D4382F; --accent-dim: #A02C26; --accent-glow: rgba(212, 56, 47, 0.15);
      --text-1: #F2EBDC; --text-2: #8B8680; --text-3: #5A5550;
      --success: #6FA85B; --warning: #E8A33D;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; background: var(--bg-1); color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      overscroll-behavior: none;
    }
    body { padding-top: env(safe-area-inset-top); }
    input, select, textarea { -webkit-appearance: none; appearance: none; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
    button { cursor: pointer; font-family: inherit; transition: transform 80ms ease-out, background 120ms; background: transparent; color: inherit; border: none; padding: 0; }
    button:active { transform: scale(0.97); }

    .app { min-height: 100vh; background: var(--bg-1); padding-bottom: calc(64px + env(safe-area-inset-bottom)); max-width: 600px; margin: 0 auto; position: relative; }
    .pad { padding: 28px 20px 20px; }

    .anim-fade { animation: aF 200ms ease-out; }
    .anim-slide-up { animation: aSU 300ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .anim-slide-down { animation: aSD 250ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes aF { from { opacity: 0; } to { opacity: 1; } }
    @keyframes aSU { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes aSD { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pC { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .set-check.just-checked { animation: pC 280ms ease-out; }

    .eyebrow { font-size: 10px; letter-spacing: 2px; color: var(--text-2); font-weight: 600; }
    h1 { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 0 0; line-height: 1; color: var(--text-1); font-family: Impact, 'Helvetica Neue Condensed', sans-serif; text-transform: uppercase; }
    .subtitle { font-size: 14px; color: var(--text-2); margin-top: 6px; letter-spacing: 0.3px; }
    .section-label { font-size: 10px; letter-spacing: 2px; color: var(--text-2); font-weight: 700; }

    /* Today */
    .countdown { background: var(--bg-2); border-left: 3px solid var(--accent); padding: 18px 16px; margin-top: 18px; display: flex; align-items: center; justify-content: space-between; }
    .countdown-label { font-size: 10px; letter-spacing: 1.5px; color: var(--text-2); font-weight: 600; }
    .countdown-target { font-size: 14px; font-weight: 700; color: var(--text-1); font-family: Impact, sans-serif; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .countdown-date { font-size: 11px; color: var(--text-2); margin-top: 4px; }
    .countdown-num { font-size: 44px; font-weight: 800; color: var(--accent); font-family: Impact, sans-serif; line-height: 0.85; letter-spacing: -1.5px; }
    .countdown-num-sub { font-size: 10px; color: var(--text-2); text-align: right; letter-spacing: 1.5px; font-weight: 600; }
    .recovery { margin-top: 16px; background: var(--bg-2); padding: 12px 16px; }
    .recovery-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .recovery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .recovery-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .recovery-lift { font-size: 10px; letter-spacing: 1px; color: var(--text-2); font-weight: 700; }
    .recovery-time { font-size: 18px; font-weight: 800; font-family: ui-monospace, monospace; letter-spacing: -0.5px; }
    .recovery-time.fresh { color: var(--text-3); }
    .recovery-time.warning { color: var(--warning); }
    .recovery-time.ready { color: var(--success); }
    .recovery-time.never { color: var(--text-3); }
    .quick-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 16px; }
    .quick-card { background: var(--bg-2); padding: 12px; }
    .quick-card .eyebrow { display: block; margin-bottom: 8px; }
    .bw-display { font-size: 24px; font-weight: 800; color: var(--text-1); font-family: ui-monospace, monospace; letter-spacing: -0.5px; line-height: 1; cursor: pointer; }
    .bw-display.empty { color: var(--text-3); }
    .bw-unit { font-size: 12px; color: var(--text-2); margin-left: 3px; font-family: -apple-system, sans-serif; font-weight: 600; }
    .readiness-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .readiness-btn { background: transparent; border: 1px solid var(--border-1); padding: 6px 0; font-size: 18px; line-height: 1; transition: all 120ms; }
    .readiness-btn.selected { background: var(--accent-glow); border-color: var(--accent); }
    .readiness-btn:active { background: var(--bg-3); }
    .session-section { margin-top: 24px; margin-bottom: 24px; }
    .session-day-name { font-size: 22px; font-weight: 800; color: var(--text-1); font-family: Impact, sans-serif; text-transform: uppercase; letter-spacing: -0.5px; line-height: 1.1; margin-top: 8px; }
    .session-week-info { font-size: 11px; color: var(--text-2); letter-spacing: 1px; margin-top: 6px; margin-bottom: 16px; font-weight: 600; }
    .ex-list { margin-bottom: 20px; }
    .ex-list-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border-1); gap: 12px; }
    .ex-list-row:last-child { border-bottom: none; }
    .ex-list-name { font-size: 13px; color: var(--text-1); flex: 1; }
    .ex-mark { color: var(--border-2); margin-right: 6px; font-size: 9px; }
    .ex-mark.main { color: var(--accent); }
    .ex-list-stats { font-size: 12px; color: var(--accent); font-family: ui-monospace, monospace; white-space: nowrap; font-weight: 600; }
    .cta { width: 100%; padding: 18px; background: var(--accent); color: var(--text-1); font-weight: 800; font-size: 14px; letter-spacing: 2px; }
    .cta:active { background: var(--accent-dim); }
    .last-session { background: var(--bg-2); padding: 14px 16px; margin-top: 24px; }
    .last-session-info { font-size: 14px; color: var(--text-1); font-weight: 600; margin-top: 6px; }
    .last-session-detail { font-size: 12px; color: var(--accent); margin-top: 4px; font-family: ui-monospace, monospace; font-weight: 600; }
    .last-session-empty { color: var(--text-3); font-size: 12px; font-style: italic; margin-top: 4px; }
    .progress-block { margin-top: 32px; }
    .progress-lbl { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1.5px; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
    .progress-bar { height: 3px; background: var(--border-1); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }

    /* Programme */
    .week-tabs { display: grid; gap: 6px; margin-top: 24px; margin-bottom: 20px; }
    .week-tab { padding: 10px 0; background: transparent; color: var(--text-2); border: 1px solid var(--border-1); font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .week-tab.active { background: var(--accent); color: var(--text-1); border-color: var(--accent); }
    .block-badge { display: inline-block; padding: 4px 8px; background: var(--bg-2); color: var(--text-2); font-size: 10px; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 12px; }
    .day-row { width: 100%; background: var(--bg-2); border-left: 3px solid var(--border-1); padding: 16px; margin-bottom: 8px; color: var(--text-1); text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .day-row.done { border-left-color: var(--success); }
    .day-row.test { border-left-color: var(--accent); }
    .day-label { font-size: 10px; letter-spacing: 1.5px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
    .day-name { font-size: 16px; font-weight: 600; color: var(--text-1); }
    .day-date { font-size: 11px; color: var(--text-2); margin-top: 4px; font-family: ui-monospace, monospace; }
    .day-arrow { color: var(--text-2); font-size: 18px; }
    .day-arrow.done { color: var(--success); }

    /* Session */
    .back-btn { color: var(--text-2); font-size: 12px; letter-spacing: 1px; margin-bottom: 16px; }
    .session-progress { display: flex; align-items: center; gap: 12px; margin-top: 12px; margin-bottom: 24px; font-size: 11px; color: var(--text-2); letter-spacing: 1px; }
    .mini-bar { flex: 1; height: 2px; background: var(--border-1); }
    .mini-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
    .ex-card { background: var(--bg-2); padding: 16px; margin-bottom: 16px; }
    .ex-name { font-size: 15px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
    .ex-target { font-size: 12px; color: var(--accent); font-family: ui-monospace, monospace; }
    .ex-note { font-size: 11px; color: var(--text-2); margin-top: 4px; font-style: italic; }
    .ex-test-banner { background: var(--accent-glow); border: 1px solid var(--accent); padding: 8px 10px; margin-top: 8px; font-size: 11px; color: var(--text-1); letter-spacing: 0.5px; font-weight: 600; }
    .sets-grid { display: grid; grid-template-columns: 24px 1fr 1fr 1fr 40px; gap: 8px; align-items: center; margin-top: 12px; }
    .sets-grid.with-label { grid-template-columns: 24px 80px 1fr 1fr 40px; }
    .set-head { font-size: 9px; letter-spacing: 1px; color: var(--text-2); font-weight: 600; text-transform: uppercase; padding-bottom: 4px; border-bottom: 1px solid var(--border-1); }
    .set-num { font-size: 13px; color: var(--text-2); font-family: ui-monospace, monospace; font-weight: 600; }
    .set-input { background: var(--bg-1); border: 1px solid var(--border-1); color: var(--text-1); padding: 8px 6px; font-size: 14px; font-family: ui-monospace, monospace; text-align: center; width: 100%; }
    .set-label { font-size: 10px; color: var(--text-2); letter-spacing: 0.5px; line-height: 1.2; padding-right: 4px; }
    .set-label.attempt { color: var(--accent); font-weight: 700; }
    .set-check { width: 36px; height: 36px; border: 1px solid var(--border-1); font-size: 18px; font-weight: 700; color: var(--text-2); display: flex; align-items: center; justify-content: center; }
    .set-check.done { background: var(--success); color: var(--bg-1); border-color: var(--success); }

    /* Timer */
    .timer { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 20px; right: 20px; max-width: 560px; margin: 0 auto; background: var(--bg-2); border: 1px solid var(--accent); padding: 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 32px rgba(0,0,0,0.6); z-index: 20; }
    .timer-lbl { font-size: 10px; letter-spacing: 1.5px; color: var(--text-2); font-weight: 600; flex: 1; }
    .timer-num { font-size: 32px; font-weight: 800; color: var(--accent); font-family: ui-monospace, monospace; letter-spacing: -1px; margin: 0 16px; }
    .timer-skip { color: var(--text-2); border: 1px solid var(--border-1); padding: 8px 12px; font-size: 10px; letter-spacing: 1px; }

    /* Nav */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-1); border-top: 1px solid var(--border-1); display: flex; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); z-index: 10; max-width: 600px; margin: 0 auto; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; font-weight: 600; color: var(--text-2); }
    .tab-btn.active { color: var(--accent); }
    .tab-icon { font-size: 18px; line-height: 1; }
    .tab-label { font-size: 10px; margin-top: 4px; letter-spacing: 0.5px; }

    /* Stats */
    .stat-section { margin-bottom: 32px; }
    .stat-section-head { font-size: 10px; letter-spacing: 2px; color: var(--text-2); font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-1); }
    .stats-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 18px; }
    .stat-box { background: var(--bg-2); padding: 14px 12px; }
    .stat-num { font-size: 28px; font-weight: 800; color: var(--accent); font-family: Impact, sans-serif; line-height: 1; }
    .stat-lbl { font-size: 10px; letter-spacing: 1.5px; color: var(--text-2); margin-top: 6px; font-weight: 600; }
    .e1rm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .e1rm-card { background: var(--bg-2); padding: 12px; }
    .e1rm-name { font-size: 11px; letter-spacing: 1.5px; color: var(--text-2); font-weight: 600; }
    .e1rm-val { font-size: 22px; font-weight: 800; color: var(--accent); font-family: ui-monospace, monospace; letter-spacing: -0.5px; margin-top: 4px; line-height: 1; }
    .e1rm-trend { font-size: 10px; color: var(--text-2); margin-top: 4px; }
    .e1rm-trend.up { color: var(--success); }
    .chart-wrap { background: var(--bg-2); padding: 16px 12px 12px; }
    .chart-svg { width: 100%; height: 180px; }
    .axis-lbl { font-size: 9px; fill: var(--text-2); font-family: ui-monospace, monospace; }
    .bar-fill { fill: var(--accent); }
    .grid-line { stroke: var(--border-1); stroke-dasharray: 2 4; }
    .compliance-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-1); align-items: center; }
    .compliance-week { font-size: 12px; color: var(--text-1); font-weight: 600; }
    .compliance-bar-wrap { flex: 1; height: 4px; background: var(--border-1); margin: 0 12px; }
    .compliance-bar-fill { height: 100%; background: var(--success); }
    .compliance-val { font-size: 12px; color: var(--text-2); font-family: ui-monospace, monospace; min-width: 50px; text-align: right; }
    .empty { text-align: center; color: var(--text-3); font-size: 12px; font-style: italic; padding: 40px 0; }
    .reset-btn { color: var(--text-2); border: 1px solid var(--border-1); padding: 12px 16px; font-size: 11px; letter-spacing: 1.5px; margin-top: 32px; width: 100%; font-weight: 600; }

    /* ===== EDITOR MOBILE INTÉGRÉ (v7) ===== */
    .med-header { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; margin-bottom: 4px; }
    .med-title { flex: 1; font-size: 24px; font-weight: 800; color: var(--text-1); font-family: Impact, sans-serif; text-transform: uppercase; letter-spacing: -0.5px; line-height: 1.1; }
    .med-title-btn { color: var(--text-2); padding: 6px 10px; font-size: 14px; }
    .med-title-btn:active { color: var(--accent); }

    .med-week-tabs { display: grid; gap: 4px; margin-top: 20px; margin-bottom: 16px; }
    .med-week-tab { padding: 12px 4px; background: transparent; color: var(--text-2); border: 1px solid var(--border-1); font-size: 12px; font-weight: 800; letter-spacing: 0.5px; }
    .med-week-tab.active { background: var(--accent); color: var(--text-1); border-color: var(--accent); }
    .med-week-tab-add { color: var(--accent); border-color: var(--border-2); border-style: dashed; font-size: 16px; }

    .med-week-info { margin-bottom: 16px; }
    .med-week-name-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .med-week-badge { font-size: 11px; letter-spacing: 2px; color: var(--text-1); font-weight: 700; }
    .med-week-meta { font-size: 10px; color: var(--text-3); margin-top: 2px; letter-spacing: 1px; font-weight: 600; }
    .med-week-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .med-week-action-btn { padding: 10px 4px; background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border-1); font-size: 10px; letter-spacing: 0.5px; font-weight: 700; }
    .med-week-action-btn.danger { color: var(--accent); }
    .med-week-action-btn:active { background: var(--bg-3); }

    .med-day { background: var(--bg-2); margin-bottom: 10px; border-left: 3px solid var(--border-1); }
    .med-day-head { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border-1); gap: 6px; }
    .med-day-info { flex: 1; min-width: 0; }
    .med-day-label { font-size: 10px; letter-spacing: 1.5px; color: var(--text-2); font-weight: 700; }
    .med-day-name { font-size: 15px; font-weight: 700; color: var(--text-1); margin-top: 3px; }
    .med-day-actions { display: flex; gap: 0; flex-shrink: 0; }
    .med-day-body { padding: 8px; }

    .med-ex { background: var(--bg-3); padding: 10px 12px; margin-bottom: 6px; border-left: 3px solid var(--border-2); }
    .med-ex.main-mark { border-left-color: var(--accent); }
    .med-ex-line-1 { display: flex; align-items: center; gap: 4px; }
    .med-ex-marker { padding: 6px 8px; font-size: 12px; color: var(--text-3); background: transparent; border: none; }
    .med-ex-marker.main { color: var(--accent); }
    .med-ex-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .med-ex-actions { display: flex; gap: 0; flex-shrink: 0; }
    .med-ex-line-2 { display: flex; align-items: center; gap: 4px; margin-top: 8px; padding-left: 30px; flex-wrap: wrap; }
    .med-inline-input {
      background: var(--bg-1); border: 1px solid var(--border-1); color: var(--accent);
      padding: 8px 4px; font-size: 14px; font-family: ui-monospace, monospace;
      text-align: center; font-weight: 700; height: 38px;
    }
    .med-inline-input:focus { border-color: var(--accent); outline: none; background: var(--bg-2); }
    .med-inline-input.i-sets { width: 46px; }
    .med-inline-input.i-reps { width: 56px; }
    .med-inline-input.i-weight { width: 72px; }
    .med-inline-input::-webkit-outer-spin-button, .med-inline-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .med-inline-sep { color: var(--text-3); font-size: 13px; font-family: ui-monospace, monospace; margin: 0 2px; }
    .med-inline-unit { font-size: 11px; color: var(--text-2); font-weight: 600; margin-left: 2px; }
    .med-ex-extras { font-size: 10px; color: var(--text-2); margin-top: 6px; padding-left: 30px; letter-spacing: 0.3px; font-family: ui-monospace, monospace; }
    .med-ex-note { font-size: 11px; color: var(--text-2); font-style: italic; margin-top: 6px; padding-left: 30px; }

    .med-icon-btn { color: var(--text-2); padding: 10px 10px; font-size: 14px; min-width: 40px; background: transparent; border: none; }
    .med-icon-btn.danger { color: var(--accent); }
    .med-icon-btn:active { background: var(--bg-1); }

    .med-add-btn { display: block; width: 100%; padding: 10px; background: transparent; border: 1px dashed var(--border-2); color: var(--text-2); font-size: 11px; letter-spacing: 1px; margin-top: 4px; font-weight: 600; }
    .med-add-btn:active { background: var(--bg-3); }
    .med-add-btn-lg { padding: 14px; margin-top: 8px; font-size: 12px; letter-spacing: 1.5px; }

    .med-admin { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-1); }
    .med-admin-title { font-size: 10px; letter-spacing: 2px; color: var(--text-2); font-weight: 700; margin-bottom: 12px; }
    .med-admin-btns { display: grid; gap: 6px; }
    .med-admin-btn { padding: 14px 12px; background: var(--bg-2); color: var(--text-1); border: 1px solid var(--border-1); font-size: 11px; letter-spacing: 1px; font-weight: 700; text-align: center; }
    .med-admin-btn.danger { color: var(--accent); }
    .med-admin-btn:active { background: var(--bg-3); }
    .med-admin-note { font-size: 11px; color: var(--text-3); margin-top: 12px; line-height: 1.5; }
    .med-admin-note b { color: var(--accent); font-weight: 700; word-break: break-all; }

    /* ===== EDITOR MOBILE (ancien sync PC — obsolète mais gardé pour compat) ===== */
    .pc-notice { background: var(--bg-2); border-left: 3px solid var(--accent); padding: 18px 16px; margin-top: 24px; }
    .pc-notice-title { font-size: 16px; font-weight: 800; color: var(--text-1); font-family: Impact, sans-serif; text-transform: uppercase; letter-spacing: -0.3px; margin-bottom: 8px; }
    .pc-notice-body { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 14px; }
    .pc-notice-url { background: var(--bg-1); border: 1px solid var(--border-1); padding: 12px 14px; margin-bottom: 14px; cursor: pointer; transition: border-color 120ms; }
    .pc-notice-url:active { border-color: var(--accent); }
    .pc-notice-url-value { font-size: 12px; color: var(--accent); font-family: ui-monospace, monospace; word-break: break-all; font-weight: 700; }
    .pc-notice-url-hint { font-size: 10px; color: var(--text-3); letter-spacing: 1.5px; margin-top: 4px; font-weight: 600; }
