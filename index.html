    function renderPcWeek(w, i) {
      const expanded = state.editorExpandedWeeks[w.id] !== false;
      return `<div class="pc-week">
        <div class="pc-week-head" data-action="toggle-week" data-week="${w.id}">
          <span class="pc-chevron">${expanded ? '▼' : '▶'}</span>
          <span class="pc-week-name">S${i+1} · ${esc(w.name)}</span>
          <span class="pc-week-badge">${w.days.length} j</span>
          <div class="pc-row-actions">
            <button class="pc-icon-btn" data-action="rename-week" data-week="${w.id}" title="Renommer">✎</button>
            <button class="pc-icon-btn" data-action="duplicate-week" data-week="${w.id}" title="Dupliquer">⧉</button>
            <button class="pc-icon-btn danger" data-action="delete-week" data-week="${w.id}" title="Supprimer">×</button>
          </div>
        </div>
        ${expanded ? `<div class="pc-week-body">
          ${w.days.map(d => renderPcDay(w.id, d)).join('')}
          <button class="pc-add-btn" data-action="add-day" data-week="${w.id}">+ JOUR</button>
        </div>` : ''}
      </div>`;
    }

    function renderPcDay(wId, d) {
      return `<div class="pc-day" data-drop-zone="day" data-week="${wId}" data-day="${d.id}">
        <div class="pc-day-head">
          <div class="pc-day-info">
            <span class="pc-day-label">${esc(d.label)}${d.date ? ' · ' + fmtDateShort(d.date) : ''}</span>
            <span class="pc-day-name">${esc(d.name)}</span>
            ${d.isTest ? '<span class="pc-day-test-badge">TEST</span>' : ''}
          </div>
          <div class="pc-row-actions">
            <button class="pc-icon-btn" data-action="edit-day" data-week="${wId}" data-day="${d.id}" title="Modifier">✎</button>
            <button class="pc-icon-btn" data-action="duplicate-day" data-week="${wId}" data-day="${d.id}" title="Dupliquer">⧉</button>
            <button class="pc-icon-btn danger" data-action="delete-day" data-week="${wId}" data-day="${d.id}" title="Supprimer">×</button>
          </div>
        </div>
        <div class="pc-day-body">
          ${(d.ex || []).map((ex, i) => renderPcExercise(wId, d.id, ex, i)).join('')}
          <button class="pc-add-btn" data-action="add-exercise-to-day" data-week="${wId}" data-day="${d.id}">+ ajouter un exercice</button>
        </div>
      </div>`;
    }

    function renderPcExercise(wId, dId, ex, i) {
      const def = getExDef(ex);
      const canInline = !ex.isTest;
      const extras = [];
      if (ex.rest) extras.push(`${ex.rest}s`);
      return `<div class="pc-ex-row ${ex.main ? 'main-mark' : ''}" draggable="true" data-draggable="program" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}"${ex.note ? ` title="${esc(ex.note)}"` : ''}>
        <span class="pc-grip">⋮⋮</span>
        <button class="pc-ex-marker ${ex.main ? 'main' : ''}" data-action="edit-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Repos, note, marquer principal">${ex.main ? '●' : '○'}</button>
        <span class="pc-ex-name">${esc(def.name)}</span>
        ${canInline ? `<div class="pc-ex-inline">
          <input class="pc-inline-input i-sets" type="number" min="1" value="${ex.sets ?? ''}" data-inline="sets" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" draggable="false" title="Séries">
          <span class="pc-inline-sep">×</span>
          <input class="pc-inline-input i-reps" type="text" value="${esc(ex.reps ?? '')}" data-inline="reps" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" draggable="false" title="Reps visées">
          <span class="pc-inline-slash">/</span>
          <input class="pc-inline-input i-actual actual" type="text" value="${esc(ex.repsActual ?? '')}" data-inline="repsActual" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" draggable="false" placeholder="—" title="Reps réelles">
          <span class="pc-inline-sep">@</span>
          <input class="pc-inline-input i-weight" type="number" step="2.5" value="${ex.weight ?? ''}" data-inline="weight" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" placeholder="—" draggable="false" title="Charge">
          <span class="pc-inline-unit">kg</span>
        </div>` : `<span class="pc-ex-stats">${ex.overrides ? ex.overrides.length : ex.sets} étapes · TEST</span>`}
        ${extras.length ? `<span class="pc-ex-extra">${esc(extras.join(' · '))}</span>` : ''}
        <div class="pc-row-actions">
          ${canInline ? `<button class="pc-icon-btn" data-action="edit-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Repos, note">✎</button>` : ''}
          <button class="pc-icon-btn danger" data-action="delete-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Supprimer">×</button>
        </div>
      </div>`;
    }

    function renderPcLibraryList() {
      const q = state.editorLibrarySearch.toLowerCase().trim();
      const items = Object.values(state.library)
        .filter(x => state.editorLibraryFilter === 'all' || x.group === state.editorLibraryFilter)
        .filter(x => !q || x.name.toLowerCase().includes(q))
        .sort((a, b) => a.name.localeCompare(b.name));
      if (items.length === 0) return `<div class="pc-empty">Aucun exercice trouvé.</div>`;
      return items.map(ex => {
        const musclesStr = (ex.muscles || []).map(m => MUSCLE_LABELS[m] || m).join(', ');
        const isSelected = !!state.selectedLibIds[ex.id];
        return `<div class="pc-lib-item ${isSelected ? 'selected' : ''}" draggable="true" data-draggable="library" data-lib-id="${ex.id}">
          <button class="pc-lib-select ${isSelected ? 'checked' : ''}" data-action="toggle-lib-select" data-lib-id="${ex.id}" title="Sélectionner pour attribution en masse">${isSelected ? '✓' : ''}</button>
          <span class="pc-grip">⋮⋮</span>
          <div style="flex:1;min-width:0;">
            <div class="pc-lib-name">${esc(ex.name)}</div>
            ${musclesStr ? `<div class="pc-lib-muscles">${esc(musclesStr)}</div>` : ''}
          </div>
          <span class="pc-lib-group">${esc(GROUP_LABELS[ex.group] || ex.group)}</span>
          <button class="pc-icon-btn" data-action="edit-lib-exercise" data-lib-id="${ex.id}" title="Modifier">✎</button>
        </div>`;
      }).join('');
    }

    // ============================================================
    // RENDER: MODAL
    // ============================================================
    function renderModal() {
      if (!state.modal) return '';
      const m = state.modal;
      if (m.type === 'edit-exercise') {
        const ex = m.data.exercise;
        const def = getExDef(ex);
        return modalWrap(def.name, 'Séries, reps et charge se modifient sur la ligne. Ici : repos, note, principal.', `
          <div class="modal-field"><label class="modal-label">REPOS (secondes)</label><input class="modal-input" id="m-rest" type="number" inputmode="numeric" value="${ex.rest ?? 60}"></div>
          <div class="modal-field"><label class="modal-label">NOTE</label><textarea class="modal-input textarea text-normal" id="m-note" placeholder="ex. ~32,5 kg/main, semi-pronation">${esc(ex.note || '')}</textarea></div>
          <div class="modal-check-row" data-action="toggle-main">
            <div class="modal-check ${ex.main ? 'checked' : ''}" id="m-main-check">${ex.main ? '✓' : ''}</div>
            <span class="modal-check-lbl">Mouvement principal</span>
          </div>
        `, [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Enregistrer', cls: 'confirm', action: 'save-exercise' },
        ]);
      }
      if (m.type === 'edit-day') {
        const d = m.data.day;
        return modalWrap('Modifier la séance', '', `
          <div class="modal-field-row">
            <div class="modal-field"><label class="modal-label">LIBELLÉ (jour)</label><input class="modal-input text-normal" id="m-label" type="text" value="${esc(d.label || '')}" placeholder="ex. Lundi"></div>
            <div class="modal-field"><label class="modal-label">DATE (optionnel)</label><input class="modal-input" id="m-date" type="date" value="${esc(d.date || '')}"></div>
          </div>
          <div class="modal-field"><label class="modal-label">NOM DE LA SÉANCE</label><input class="modal-input text-normal" id="m-name" type="text" value="${esc(d.name || '')}" placeholder="ex. Squat + OHP"></div>
        `, [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Enregistrer', cls: 'confirm', action: 'save-day' },
        ]);
      }
      if (m.type === 'edit-lib-exercise') {
        const ex = m.data.libEx;
        const isNew = m.data.isNew;
        const activeMuscles = ex.muscles || [];
        return modalWrap(isNew ? 'Nouvel exercice' : 'Modifier exercice', 'Bibliothèque · nom, groupe, muscles sollicités, repos', `
          <div class="modal-field"><label class="modal-label">NOM</label><input class="modal-input text-normal" id="m-name" type="text" value="${esc(ex.name || '')}" placeholder="ex. Squat compétition"></div>
          <div class="modal-field-row">
            <div class="modal-field"><label class="modal-label">GROUPE</label>
              <select class="modal-input text-normal" id="m-group">
                ${GROUPS.map(g => `<option value="${g}"${ex.group === g ? ' selected' : ''}>${GROUP_LABELS[g]}</option>`).join('')}
              </select>
            </div>
            <div class="modal-field"><label class="modal-label">REPOS DÉFAUT (sec)</label><input class="modal-input" id="m-rest" type="number" value="${ex.restDefault ?? 60}"></div>
          </div>
          <div class="modal-field">
            <label class="modal-label">MUSCLES SOLLICITÉS</label>
            <div class="muscle-chips">
              ${MUSCLES.map(mus => `<button class="muscle-chip ${activeMuscles.includes(mus) ? 'selected' : ''}" data-action="toggle-lib-muscle" data-muscle="${mus}">${MUSCLE_LABELS[mus]}</button>`).join('')}
            </div>
          </div>
        `, [
          ...(isNew ? [] : [{ label: 'Supprimer', cls: 'danger', action: 'delete-lib-exercise' }]),
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Enregistrer', cls: 'confirm', action: 'save-lib-exercise' },
        ]);
      }
      if (m.type === 'pick-exercise') {
        const items = Object.values(state.library).sort((a, b) => a.name.localeCompare(b.name));
        return modalWrap('Ajouter un exercice', 'Tap pour ajouter à la séance', `
          <input class="modal-input text-normal" id="pick-search" type="search" placeholder="Rechercher..." style="margin-bottom:10px;">
          <div class="lib-picker-list" id="pick-list">
            ${items.map(ex => `<div class="lib-picker-item pick-choice" data-lib-id="${ex.id}" data-action="pick-exercise-confirm">
              <div><div class="lib-picker-name">${esc(ex.name)}</div>${ex.muscles && ex.muscles.length ? `<div class="pc-lib-muscles">${esc(ex.muscles.map(mu => MUSCLE_LABELS[mu]).join(', '))}</div>` : ''}</div>
              <div class="lib-picker-meta">${esc(GROUP_LABELS[ex.group] || ex.group)}</div>
            </div>`).join('')}
          </div>
        `, [{ label: 'Annuler', cls: 'cancel', action: 'close-modal' }]);
      }
      if (m.type === 'library-manager') {
        const items = Object.values(state.library).sort((a, b) => (a.group + a.name).localeCompare(b.group + b.name));
        return modalWrap('Gestion bibliothèque', `${items.length} exercices`, `
          <button class="pc-tool-btn primary" style="width:100%;padding:10px;margin-bottom:12px;" data-action="add-lib-exercise">+ NOUVEL EXERCICE</button>
          <div style="max-height:60vh;overflow-y:auto;">
            ${items.map(ex => `<div class="lib-picker-item" data-action="edit-lib-exercise" data-lib-id="${ex.id}">
              <div>
                <div class="lib-picker-name">${esc(ex.name)}</div>
                <div class="lib-picker-meta">${esc(GROUP_LABELS[ex.group] || ex.group)} · ${ex.restDefault}s${ex.muscles && ex.muscles.length ? ' · ' + ex.muscles.map(mu => MUSCLE_LABELS[mu]).join(', ') : ''}</div>
              </div>
              <button class="pc-icon-btn">✎</button>
            </div>`).join('')}
          </div>
        `, [{ label: 'Fermer', cls: 'cancel', action: 'close-modal' }]);
      }
      if (m.type === 'bulk-muscles') {
        const muscle = m.data.muscle || 'chest';
        // If user has selected exercises via checkboxes in library, pre-fill selection
        const preSelected = Object.keys(state.selectedLibIds).filter(k => state.selectedLibIds[k]);
        if (!m.data.exSelection) {
          m.data.exSelection = {};
          Object.values(state.library).forEach(ex => {
            // Default: if muscle already assigned, tick; if pre-selected from library, tick
            m.data.exSelection[ex.id] = (ex.muscles || []).includes(muscle) || preSelected.includes(ex.id);
          });
          // If user came from bulk selection, force the ones they selected as target for adding muscle
          if (preSelected.length > 0) {
            m.data.forceOnPreselected = preSelected;
          }
        }
        const items = Object.values(state.library).sort((a, b) => a.name.localeCompare(b.name));
        return modalWrap('Attribution muscles en masse', 'Choisis un muscle, coche les exercices qui le sollicitent, valide.', `
          <div class="modal-field">
            <label class="modal-label">MUSCLE À ATTRIBUER</label>
            <select class="modal-input text-normal" id="m-bulk-muscle">
              ${MUSCLES.map(mus => `<option value="${mus}"${muscle === mus ? ' selected' : ''}>${MUSCLE_LABELS[mus]}</option>`).join('')}
            </select>
          </div>
          <div class="modal-field">
            <label class="modal-label">EXERCICES (cochés = sollicitent ce muscle)</label>
            <div class="lib-picker-list" style="max-height:400px;">
              ${items.map(ex => {
                const checked = m.data.exSelection[ex.id];
                return `<div class="lib-picker-item ${checked ? 'checked' : ''}" data-action="toggle-bulk-ex" data-lib-id="${ex.id}">
                  <div class="lib-picker-check ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</div>
                  <div style="flex:1;">
                    <div class="lib-picker-name">${esc(ex.name)}</div>
                    <div class="lib-picker-meta">${esc(GROUP_LABELS[ex.group] || ex.group)}</div>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
          <div class="modal-instruct">
            <b>Enregistrer</b> : pour le muscle choisi, les exercices cochés l'auront comme muscle sollicité, les décochés ne l'auront pas. Les autres muscles de chaque exercice sont préservés.
          </div>
        `, [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Enregistrer', cls: 'confirm', action: 'save-bulk-muscles' },
        ]);
      }
      if (m.type === 'import') {
        return modalWrap('Importer un programme', 'Colle un JSON généré par un export', `
          <div class="modal-instruct">Cela remplacera <b>ton programme et ta bibliothèque</b> actuels. Confirmation demandée.</div>
          <div class="modal-field" style="margin-top:14px;">
            <label class="modal-label">JSON</label>
            <textarea class="modal-input mono-code" id="m-json" placeholder='{ "program": ..., "library": ... }'></textarea>
          </div>
        `, [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Importer', cls: 'confirm', action: 'do-import' },
        ]);
      }
      if (m.type === 'export') {
        const data = JSON.stringify({ program: state.program, library: state.library }, null, 0);
        return modalWrap('Export du programme', `Copie ce texte (${(data.length/1024).toFixed(1)} Ko) et sauvegarde-le`, `
          <div class="modal-field"><textarea class="modal-input mono-code" id="m-json" readonly>${esc(data)}</textarea></div>
        `, [
          { label: 'Fermer', cls: 'cancel', action: 'close-modal' },
          { label: '📋 Copier', cls: 'confirm', action: 'copy-export' },
        ]);
      }
      if (m.type === 'sync-cloud') {
        const s = state.sync;
        const statusLbl = s.status === 'syncing' ? '⟳ Sync en cours...'
                      : s.status === 'ok' ? '✓ Synchronisé'
                      : s.status === 'error' ? '⚠ Erreur'
                      : 'Prêt';
        return modalWrap('Sync cloud · GitHub Gist', 'Sync automatique via un Gist privé de ton compte GitHub', `
          ${!s.enabled ? `
            <div class="modal-instruct">
              <b>1.</b> Va sur GitHub → clique ton avatar → <b>Settings</b><br>
              <b>2.</b> Tout en bas du menu de gauche → <b>Developer settings</b><br>
              <b>3.</b> <b>Personal access tokens</b> → <b>Tokens (classic)</b><br>
              <b>4.</b> <b>Generate new token (classic)</b> · Nom : "PL Tracker" · Expiration : "No expiration" (ou 1 an)<br>
              <b>5.</b> Coche <b>uniquement <code>gist</code></b> dans les scopes<br>
              <b>6.</b> Génère, copie le token (commence par <code>ghp_</code>), colle ci-dessous
            </div>
            <div class="modal-field" style="margin-top:14px;">
              <label class="modal-label">TOKEN GITHUB</label>
              <input class="modal-input" id="m-sync-token" type="password" placeholder="ghp_..." autocomplete="off" autocapitalize="off" spellcheck="false">
            </div>
            <div class="modal-field" style="font-size:11px;color:var(--text-3);line-height:1.5;">
              Sur d'autres appareils : colle le même token, l'app retrouvera le même Gist automatiquement.
            </div>
          ` : `
            <div class="modal-instruct">
              <b>Statut :</b> <span style="color:${s.status === 'ok' ? 'var(--success)' : s.status === 'error' ? 'var(--accent)' : 'var(--text-1)'};">${statusLbl}</span><br>
              ${s.lastAt ? `<b>Dernière sync :</b> ${fmtRelative(s.lastAt)} <span style="color:var(--text-3);">(${new Date(s.lastAt).toLocaleString('fr-FR')})</span><br>` : ''}
              <b>Gist ID :</b> <code>${esc(s.gistId.slice(0, 12))}...</code>
              ${s.error ? `<br><span style="color:var(--accent);"><b>Erreur :</b> ${esc(s.error)}</span>` : ''}
            </div>
            <div style="margin-top:14px;font-size:11px;color:var(--text-3);line-height:1.5;">
              La sync se déclenche automatiquement 2 s après chaque modification et à l'ouverture de l'app. Utilise "Sync maintenant" pour forcer.
            </div>
          `}
        `, s.enabled ? [
          { label: 'Désactiver', cls: 'danger', action: 'sync-disable' },
          { label: 'Sync maintenant', cls: 'confirm', action: 'sync-now' },
          { label: 'Fermer', cls: 'cancel', action: 'close-modal' },
        ] : [
          { label: 'Annuler', cls: 'cancel', action: 'close-modal' },
          { label: 'Activer', cls: 'confirm', action: 'sync-activate' },
        ]);
      }
      return '';
    }

    function modalWrap(title, subtitle, body, actions, wide) {
      return `<div class="modal-overlay" data-action="close-modal-bg">
        <div class="modal${wide ? ' wide' : ''}">
          <div class="modal-title">${esc(title)}</div>
          ${subtitle ? `<div class="modal-subtitle">${esc(subtitle)}</div>` : ''}
          ${body}
          <div class="modal-actions">
            ${actions.map(a => `<button class="modal-btn ${a.cls}" data-action="${a.action}">${esc(a.label)}</button>`).join('')}
          </div>
        </div>
      </div>`;
    }

    // ============================================================
    // NAV + RENDER
    // ============================================================
    function renderNav() {
      if (state.view === 'session') return '';
      const views = ['program', 'editor', 'muscles'];
      const idx = Math.max(0, views.indexOf(state.view));
      const t = (v, i, l) => `<button class="tab-btn ${state.view === v ? 'active' : ''}" data-action="nav" data-view="${v}"><span class="tab-icon">${i}</span><span class="tab-label">${l}</span></button>`;
      return `<nav class="nav">
        <div class="nav-pill" style="transform: translateX(${idx * 100}%);"></div>
        ${t('program', '≡', 'Programme')}
        ${t('editor', '✎', 'Éditeur')}
        ${t('muscles', '◆', 'Muscles')}
      </nav>`;
    }

    function render() {
      const app = document.getElementById('app');
      if (state.view === 'editor' && state.editorMode === 'pc') app.classList.add('pc-mode');
      else app.classList.remove('pc-mode');

      let c = '';
      if (state.view === 'program') c = renderProgram();
      else if (state.view === 'session') c = renderSession();
      else if (state.view === 'editor') c = renderEditor();
      else if (state.view === 'muscles') c = renderMuscles();

      const modalHtml = renderModal();
      app.innerHTML = `<div id="app-content">${c}</div>${renderNav()}${modalHtml}`;

      if (lastToggle) {
        setTimeout(() => {
          const btn = document.querySelector(`[data-action="toggle-set"][data-ex="${lastToggle.ex}"][data-set="${lastToggle.set}"]`);
          if (btn) { btn.style.transform = 'scale(1.18)'; setTimeout(() => btn.style.transform = '', 200); }
        }, 0);
        lastToggle = null;
      }
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    function setView(v) { state.view = v; render(); }
    function setEditorMode(m) {
      if (m !== 'pc' && m !== 'mobile') return;
      state.editorMode = m;
      try { localStorage.setItem(K_EDITOR_MODE, m); } catch (e) {}
      render();
    }

    function startSession(weekId, dayId) {
      const w = findWeekById(weekId), d = findDayById(weekId, dayId);
      if (!w || !d) return;
      const k = sessionKey(weekId, dayId);
      if (state.progress[k]) {
        state.sessionData = state.progress[k];
        // migration: ensure repsDone exists on each set (empty for old sessions)
        state.sessionData.exercises.forEach(ex => ex.sets.forEach(s => { if (s.repsDone === undefined) s.repsDone = null; }));
      } else {
        state.sessionData = {
          completed: false,
          date: d.date || new Date().toISOString().slice(0, 10),
          exercises: (d.ex || []).map(e => ({
            libId: e.libId,
            sets: e.overrides
              ? e.overrides.map(o => ({ done: false, weight: o.weight, reps: o.reps, repsDone: null, label: o.label }))
              : Array(e.sets).fill(null).map(() => ({ done: false, weight: e.weight ?? null, reps: e.reps, repsDone: null })),
          })),
        };
      }
      state.activeSession = { weekId, dayId };
      setView('session');
    }

    function endSession() {
      const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
      state.sessionData.completed = true;
      state.progress[k] = state.sessionData;
      saveProgress();
      state.activeSession = null; state.sessionData = null;
      stopTimer();
      setView('program');
    }

    function backToProgram() {
      if (state.sessionData && state.activeSession) {
        const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
        if (state.sessionData.exercises.some(e => e.sets.some(s => s.done))) {
          state.progress[k] = state.sessionData;
          saveProgress();
        }
      }
      state.activeSession = null; state.sessionData = null;
      stopTimer();
      setView('program');
    }

    function toggleSet(exIdx, setIdx, restSec, exName) {
      const set = state.sessionData.exercises[exIdx].sets[setIdx];
      set.done = !set.done;
      const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
      state.progress[k] = state.sessionData;
      saveProgress();
      if (set.done) {
        lastToggle = { ex: exIdx, set: setIdx };
        if (navigator.vibrate) navigator.vibrate(15);
        if (restSec > 0) startTimer(restSec, exName);
      }
      render();
    }

    function updateSet(exIdx, setIdx, field, value) {
      const set = state.sessionData.exercises[exIdx].sets[setIdx];
      if (field === 'weight') set[field] = value ? parseFloat(value) : null;
      else set[field] = value;
      const k = sessionKey(state.activeSession.weekId, state.activeSession.dayId);
      state.progress[k] = state.sessionData;
      saveProgress();
    }

    function startTimer(sec, exName) {
      stopTimer();
      timer.secLeft = sec; timer.exName = exName; timer.active = true;
      timer.interval = setInterval(() => {
        timer.secLeft--;
        if (timer.secLeft <= 0) { stopTimer(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); render(); }
        else { const el = document.getElementById('timer-display'); if (el) el.textContent = fmtTime(timer.secLeft); }
      }, 1000);
    }
    function stopTimer() { if (timer.interval) clearInterval(timer.interval); timer.interval = null; timer.active = false; timer.secLeft = 0; }

    // Program structure actions
    function renameProgram() { const v = prompt('Nom du programme :', state.program.name || ''); if (v !== null) { state.program.name = v.trim(); saveProgram(); render(); } }
    function addWeek() {
      const num = programWeeks().length + 1;
      const w = { id: uid('w'), name: `Semaine ${num}`, days: [] };
      state.program.weeks.push(w);
      state.editorExpandedWeeks[w.id] = true;
      state.openWeek = w.id;
      saveProgram(); render();
    }
    function renameWeek(id) { const w = findWeekById(id); if (!w) return; const v = prompt('Nom de la semaine :', w.name); if (v && v.trim()) { w.name = v.trim(); saveProgram(); render(); } }
    function duplicateWeek(id) {
      const w = findWeekById(id); if (!w) return;
      const copy = deepClone(w); copy.id = uid('w'); copy.name = w.name + ' (copie)';
      copy.days.forEach(d => { d.id = uid('d'); });
      const idx = programWeeks().indexOf(w);
      state.program.weeks.splice(idx + 1, 0, copy);
      state.editorExpandedWeeks[copy.id] = true;
      state.openWeek = copy.id;
      saveProgram(); render();
    }
    function deleteWeek(id) {
      const w = findWeekById(id); if (!w) return;
      if (!confirm(`Supprimer la semaine "${w.name}" et ses ${w.days.length} séance${w.days.length > 1 ? 's' : ''} ?`)) return;
      state.program.weeks = programWeeks().filter(x => x.id !== id);
      if (state.openWeek === id) state.openWeek = programWeeks()[0]?.id || null;
      saveProgram(); render();
    }
    function toggleWeekExpanded(id) { state.editorExpandedWeeks[id] = !(state.editorExpandedWeeks[id] !== false); render(); }

    function addDay(wId) {
      const w = findWeekById(wId); if (!w) return;
      const d = { id: uid('d'), label: 'Jour', name: 'Nouvelle séance', date: '', ex: [] };
      w.days.push(d);
      state.modal = { type: 'edit-day', data: { weekId: wId, day: d, isNew: true } };
      saveProgram(); render();
    }
    function editDay(wId, dId) { const d = findDayById(wId, dId); if (!d) return; state.modal = { type: 'edit-day', data: { weekId: wId, day: d } }; render(); }
    function saveDay() {
      const d = state.modal.data.day;
      d.label = document.getElementById('m-label').value.trim();
      d.name = document.getElementById('m-name').value.trim();
      d.date = document.getElementById('m-date').value || '';
      state.modal = null;
      saveProgram(); render();
    }
    function duplicateDay(wId, dId) {
      const w = findWeekById(wId); const d = findDayById(wId, dId); if (!w || !d) return;
      const copy = deepClone(d); copy.id = uid('d'); copy.name = d.name + ' (copie)';
      const idx = w.days.indexOf(d);
      w.days.splice(idx + 1, 0, copy);
      saveProgram(); render();
    }
    function deleteDay(wId, dId) {
      const d = findDayById(wId, dId); if (!d) return;
      if (!confirm(`Supprimer la séance "${d.name}" ?`)) return;
      const w = findWeekById(wId);
      w.days = w.days.filter(x => x.id !== dId);
      saveProgram(); render();
    }

    function editExercise(wId, dId, i) {
      const d = findDayById(wId, dId); if (!d) return;
      state.modal = { type: 'edit-exercise', data: { weekId: wId, dayId: dId, exIdx: i, exercise: deepClone(d.ex[i]) } };
      render();
    }
    function saveExercise() {
      const { weekId, dayId, exIdx } = state.modal.data;
      const d = findDayById(weekId, dayId); if (!d) return;
      const target = d.ex[exIdx];
      const restV = parseInt(document.getElementById('m-rest').value);
      const noteV = document.getElementById('m-note').value.trim();
      target.rest = isNaN(restV) ? 60 : restV;
      if (noteV) target.note = noteV; else delete target.note;
      target.main = state.modal.data.exercise.main;
      state.modal = null;
      saveProgram(); render();
    }
    function toggleMain() { state.modal.data.exercise.main = !state.modal.data.exercise.main; render(); }
    function deleteExerciseFromDay(wId, dId, i) {
      const d = findDayById(wId, dId); if (!d) return;
      const ex = d.ex[i]; if (!ex) return;
      const def = getExDef(ex);
      if (!confirm(`Retirer "${def.name}" de cette séance ?`)) return;
      d.ex.splice(i, 1); saveProgram(); render();
    }

    function openExercisePicker(wId, dId) {
      state.modal = { type: 'pick-exercise', data: { weekId: wId, dayId: dId } };
      render();
    }
    function pickExerciseConfirm(libId) {
      const { weekId, dayId } = state.modal.data;
      addExerciseToDay(weekId, dayId, libId);
      state.modal = null;
      render();
    }
    function addExerciseToDay(wId, dId, libId, insertAtIdx) {
      const d = findDayById(wId, dId); const lib = getLibEx(libId);
      if (!d || !lib) return;
      const newEx = { libId, sets: 3, reps: 8, weight: null, rest: lib.restDefault || 60, main: false };
      if (insertAtIdx !== undefined && insertAtIdx >= 0 && insertAtIdx < d.ex.length) d.ex.splice(insertAtIdx, 0, newEx);
      else d.ex.push(newEx);
      saveProgram();
    }
    function moveExercise(fromW, fromD, fromI, toW, toD, insertAtIdx) {
      const srcDay = findDayById(fromW, fromD); const tgtDay = findDayById(toW, toD);
      if (!srcDay || !tgtDay) return;
      const [moved] = srcDay.ex.splice(fromI, 1);
      if (srcDay === tgtDay && insertAtIdx !== undefined && insertAtIdx > fromI) insertAtIdx--;
      if (insertAtIdx !== undefined && insertAtIdx >= 0 && insertAtIdx < tgtDay.ex.length) tgtDay.ex.splice(insertAtIdx, 0, moved);
      else tgtDay.ex.push(moved);
      saveProgram();
    }

    // Library actions
    function openLibraryManager() { state.modal = { type: 'library-manager' }; render(); }
    function addLibExercise() {
      const ex = { id: uid('ex'), name: '', group: 'other', restDefault: 60, muscles: [] };
      state.modal = { type: 'edit-lib-exercise', data: { libEx: ex, isNew: true } };
      render();
    }
    function editLibExercise(libId) {
      const ex = getLibEx(libId); if (!ex) return;
      const clone = deepClone(ex);
      if (!clone.muscles) clone.muscles = [];
      state.modal = { type: 'edit-lib-exercise', data: { libEx: clone, isNew: false } };
      render();
    }
    function saveLibExercise() {
      const ex = state.modal.data.libEx;
      ex.name = document.getElementById('m-name').value.trim();
      ex.group = document.getElementById('m-group').value;
      ex.restDefault = parseInt(document.getElementById('m-rest').value) || 60;
      if (!ex.name) { alert('Nom requis'); return; }
      state.library[ex.id] = ex;
      saveLibrary();
      state.modal = null;
      render();
    }
    function deleteLibExercise() {
      const ex = state.modal.data.libEx;
      if (!confirm(`Supprimer "${ex.name}" de la bibliothèque ?`)) return;
      delete state.library[ex.id];
      delete state.selectedLibIds[ex.id];
      saveLibrary();
      state.modal = null;
      render();
    }
    function toggleLibMuscle(muscle) {
      const ex = state.modal.data.libEx;
      ex.muscles = ex.muscles || [];
      const i = ex.muscles.indexOf(muscle);
      if (i >= 0) ex.muscles.splice(i, 1);
      else ex.muscles.push(muscle);
      render();
    }

    // Bulk muscle actions
    function toggleLibSelect(libId) {
      state.selectedLibIds[libId] = !state.selectedLibIds[libId];
      if (!state.selectedLibIds[libId]) delete state.selectedLibIds[libId];
      render();
    }
    function clearLibSelection() { state.selectedLibIds = {}; render(); }
    function openBulkMuscles() {
      state.modal = { type: 'bulk-muscles', data: { muscle: 'chest' } };
      render();
    }
    function toggleBulkEx(libId) {
      state.modal.data.exSelection[libId] = !state.modal.data.exSelection[libId];
      render();
    }
    function saveBulkMuscles() {
      const muscle = document.getElementById('m-bulk-muscle').value;
      const sel = state.modal.data.exSelection;
      Object.entries(sel).forEach(([libId, checked]) => {
        const ex = state.library[libId];
        if (!ex) return;
        ex.muscles = ex.muscles || [];
        const has = ex.muscles.includes(muscle);
        if (checked && !has) ex.muscles.push(muscle);
        else if (!checked && has) ex.muscles = ex.muscles.filter(m => m !== muscle);
      });
      saveLibrary();
      state.selectedLibIds = {};
      state.modal = null;
      render();
    }

    // Import/export
    function exportProgram() { state.modal = { type: 'export' }; render(); }
    function importProgram() { state.modal = { type: 'import' }; render(); }
    function doImport() {
      const raw = document.getElementById('m-json').value.trim();
      try {
        const parsed = JSON.parse(raw);
        if (!parsed.program || !parsed.library) { alert('Format invalide : besoin de {program, library}'); return; }
        if (!confirm('Remplacer le programme et la bibliothèque actuels ?')) return;
        state.program = parsed.program; state.library = parsed.library;
        saveProgram(); saveLibrary();
        state.modal = null; render();
      } catch (e) { alert('JSON invalide : ' + e.message); }
    }
    function copyExport() {
      const ta = document.getElementById('m-json');
      if (!ta) return;
      ta.select();
      try {
        navigator.clipboard.writeText(ta.value).then(() => {
          const btn = document.querySelector('[data-action="copy-export"]');
          if (btn) { const old = btn.textContent; btn.textContent = '✓ COPIÉ'; setTimeout(() => btn.textContent = old, 1500); }
        }).catch(() => { document.execCommand('copy'); });
      } catch (e) { document.execCommand('copy'); }
    }
    function resetToDefaultProgram() {
      if (!confirm('Restaurer le peak block par défaut ? La bibliothèque sera fusionnée.')) return;
      state.program = deepClone(DEFAULT_PROGRAM);
      Object.assign(state.library, DEFAULT_LIBRARY);
      saveProgram(); saveLibrary(); render();
    }
    function closeModal() { state.modal = null; render(); }

    // ============================================================
    // DRAG & DROP PC
    // ============================================================
    let pcDragData = null;
    function initPcDragDrop() {
      document.addEventListener('dragstart', (e) => {
        if (state.view !== 'editor' || state.editorMode !== 'pc') return;
        if (e.target.matches('input, textarea, select, button')) { e.preventDefault(); return; }
        const el = e.target.closest('[data-draggable]');
        if (!el) return;
        pcDragData = { ...el.dataset };
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', JSON.stringify(pcDragData)); } catch (err) {}
        el.classList.add('dragging');
      });
      document.addEventListener('dragend', () => {
        document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
        document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
        pcDragData = null;
      });
      document.addEventListener('dragover', (e) => {
        if (!pcDragData) return;
        const dz = e.target.closest('[data-drop-zone]');
        if (!dz) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });
      document.addEventListener('dragenter', (e) => {
        if (!pcDragData) return;
        const dz = e.target.closest('[data-drop-zone]');
        if (!dz) return;
        document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
        dz.classList.add('drop-hover');
      });
      document.addEventListener('drop', (e) => {
        if (!pcDragData) return;
        const dz = e.target.closest('[data-drop-zone]');
        if (!dz) return;
        e.preventDefault();
        const toW = dz.dataset.week, toD = dz.dataset.day;
        const dayBody = dz.querySelector('.pc-day-body');
        let insertAtIdx = undefined;
        if (dayBody) {
          const exEls = dayBody.querySelectorAll('.pc-ex-row');
          for (let i = 0; i < exEls.length; i++) {
            const rect = exEls[i].getBoundingClientRect();
            if (e.clientY < rect.top + rect.height / 2) { insertAtIdx = i; break; }
          }
        }
        if (pcDragData.draggable === 'library') addExerciseToDay(toW, toD, pcDragData.libId, insertAtIdx);
        else if (pcDragData.draggable === 'program') moveExercise(pcDragData.week, pcDragData.day, parseInt(pcDragData.exIdx), toW, toD, insertAtIdx);
        pcDragData = null;
        render();
      });
    }

    // ============================================================
    // EVENT DELEGATION
    // ============================================================
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const a = btn.dataset.action;
      const w = btn.dataset.week, d = btn.dataset.day, ei = btn.dataset.exIdx;

      // Modals: close bg only on direct click
      if (a === 'close-modal-bg') { if (e.target === btn) closeModal(); return; }
      // toggle-week ignores clicks on inner buttons/inputs
      if (a === 'toggle-week' && e.target.closest('.pc-row-actions, input, textarea, select')) return;

      if (a === 'nav') setView(btn.dataset.view);
      else if (a === 'start-session') startSession(w, d);
      else if (a === 'open-week') { state.openWeek = w; render(); }
      else if (a === 'back-to-program') backToProgram();
      else if (a === 'toggle-set') toggleSet(+btn.dataset.ex, +btn.dataset.set, +btn.dataset.rest, btn.dataset.exname);
      else if (a === 'end-session') endSession();
      else if (a === 'skip-timer') { stopTimer(); render(); }
      else if (a === 'set-muscles-week') { state.musclesWeek = btn.dataset.week; render(); }
      // Editor
      else if (a === 'set-editor-mode') setEditorMode(btn.dataset.mode);
      else if (a === 'rename-program') renameProgram();
      else if (a === 'add-week') addWeek();
      else if (a === 'rename-week') renameWeek(w);
      else if (a === 'duplicate-week') duplicateWeek(w);
      else if (a === 'delete-week') deleteWeek(w);
      else if (a === 'toggle-week') toggleWeekExpanded(w);
      else if (a === 'add-day') addDay(w);
      else if (a === 'edit-day') editDay(w, d);
      else if (a === 'duplicate-day') duplicateDay(w, d);
      else if (a === 'delete-day') deleteDay(w, d);
      else if (a === 'save-day') saveDay();
      else if (a === 'edit-exercise') editExercise(w, d, +ei);
      else if (a === 'save-exercise') saveExercise();
      else if (a === 'toggle-main') toggleMain();
      else if (a === 'delete-exercise') deleteExerciseFromDay(w, d, +ei);
      else if (a === 'add-exercise-to-day') openExercisePicker(w, d);
      else if (a === 'pick-exercise-confirm') pickExerciseConfirm(btn.dataset.libId);
      else if (a === 'open-library-manager') openLibraryManager();
      else if (a === 'add-lib-exercise') addLibExercise();
      else if (a === 'edit-lib-exercise') editLibExercise(btn.dataset.libId);
      else if (a === 'save-lib-exercise') saveLibExercise();
      else if (a === 'delete-lib-exercise') deleteLibExercise();
      else if (a === 'toggle-lib-muscle') toggleLibMuscle(btn.dataset.muscle);
      else if (a === 'toggle-lib-select') toggleLibSelect(btn.dataset.libId);
      else if (a === 'clear-lib-selection') clearLibSelection();
      else if (a === 'open-bulk-muscles') openBulkMuscles();
      else if (a === 'toggle-bulk-ex') toggleBulkEx(btn.dataset.libId);
      else if (a === 'save-bulk-muscles') saveBulkMuscles();
      else if (a === 'export-program') exportProgram();
      else if (a === 'import-program') importProgram();
      else if (a === 'do-import') doImport();
      else if (a === 'copy-export') copyExport();
      else if (a === 'reset-program') resetToDefaultProgram();
      else if (a === 'close-modal') closeModal();
      else if (a === 'open-sync') { state.modal = { type: 'sync-cloud' }; render(); }
      else if (a === 'sync-activate') {
        const inp = document.getElementById('m-sync-token');
        const tok = inp ? inp.value.trim() : '';
        if (!tok) { alert('Token requis'); return; }
        state.modal = null; render();
        syncActivate(tok);
      }
      else if (a === 'sync-disable') { syncDisable(); state.modal = null; render(); }
      else if (a === 'sync-now') { state.modal = null; render(); syncNow(); }
    });

    document.addEventListener('change', (e) => {
      const inp = e.target;
      // Inline edit sets/reps/actual/weight in editor
      if (inp.dataset && inp.dataset.inline && state.view === 'editor') {
        const w = inp.dataset.week, d = inp.dataset.day, i = parseInt(inp.dataset.exIdx);
        const day = findDayById(w, d);
        if (!day || !day.ex[i]) return;
        const ex = day.ex[i];
        const f = inp.dataset.inline;
        if (f === 'sets') { const n = parseInt(inp.value); ex.sets = (isNaN(n) || n < 1) ? 1 : n; }
        else if (f === 'reps') { ex.reps = inp.value.trim(); }
        else if (f === 'repsActual') { const v = inp.value.trim(); if (v) ex.repsActual = v; else delete ex.repsActual; }
        else if (f === 'weight') { ex.weight = inp.value === '' ? null : parseFloat(inp.value); }
        saveProgram();
      }
      if (inp.id === 'pc-lib-filter') {
        state.editorLibraryFilter = inp.value;
        const body = document.getElementById('pc-lib-body');
        if (body) body.innerHTML = renderPcLibraryList();
      }
      if (inp.id === 'm-bulk-muscle') {
        state.modal.data.muscle = inp.value;
        state.modal.data.exSelection = null; // force refresh from muscle
        render();
      }
    });

    document.addEventListener('input', (e) => {
      const inp = e.target;
      if (inp.dataset.field && state.view === 'session') {
        updateSet(+inp.dataset.ex, +inp.dataset.set, inp.dataset.field, inp.value);
      }
      if (inp.id === 'pc-lib-search') {
        state.editorLibrarySearch = inp.value;
        const body = document.getElementById('pc-lib-body');
        if (body) body.innerHTML = renderPcLibraryList();
      }
      if (inp.id === 'pick-search') {
        const q = inp.value.toLowerCase().trim();
        document.querySelectorAll('#pick-list .pick-choice').forEach(el => {
          const name = el.querySelector('.lib-picker-name').textContent.toLowerCase();
          el.style.display = (!q || name.includes(q)) ? '' : 'none';
        });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.modal) closeModal();
    });

    // ============================================================
    // SYNC CLOUD (GitHub Gist)
    // ============================================================
    const SYNC_FILENAME = 'pl-tracker-sync.json';
    const SYNC_DESC = 'PL Tracker sync (auto-généré)';

    function nowIso() { return new Date().toISOString(); }
    function fmtRelative(iso) {
      if (!iso) return '—';
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 5) return "à l'instant";
      if (s < 60) return `il y a ${s} s`;
      if (s < 3600) return `il y a ${Math.floor(s/60)} min`;
      if (s < 86400) return `il y a ${Math.floor(s/3600)} h`;
      return `il y a ${Math.floor(s/86400)} j`;
    }

    async function githubApi(method, path, body) {
      const headers = {
        'Authorization': 'Bearer ' + state.sync.token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      };
      if (body) headers['Content-Type'] = 'application/json';
      const res = await fetch('https://api.github.com' + path, {
        method, headers, body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) {
        let msg = res.status + ' ' + res.statusText;
        try { const j = await res.json(); if (j.message) msg = j.message; } catch(e){}
        throw new Error(msg);
      }
      return res.json();
    }

    async function findSyncGist() {
      // list gists paginated (up to 3 pages)
      for (let page = 1; page <= 3; page++) {
        const gists = await githubApi('GET', `/gists?per_page=100&page=${page}`);
        for (const g of gists) if (g.files && g.files[SYNC_FILENAME]) return g.id;
        if (gists.length < 100) break;
      }
      return null;
    }

    function getSyncPayload() {
      return {
        version: 1,
        updatedAt: state.sync.localAt || nowIso(),
        program: state.program,
        library: state.library,
        progress: state.progress,
      };
    }

    function updateLocalTimestamp() {
      state.sync.localAt = nowIso();
      try { localStorage.setItem(K_SYNC_LOCAL_AT, state.sync.localAt); } catch (e) {}
    }

    function schedulePush() {
      if (!state.sync.enabled || suspendPushSchedule) return;
      updateLocalTimestamp();
      clearTimeout(syncPushTimeout);
      syncPushTimeout = setTimeout(() => syncPush(), 2000);
    }

    async function syncActivate(token) {
      state.sync.token = token.trim();
      state.sync.status = 'syncing';
      state.sync.error = '';
      render();
      try {
        // Test the token
        const user = await githubApi('GET', '/user');
        // Find existing gist or create
        const existing = await findSyncGist();
        if (existing) {
          state.sync.gistId = existing;
          state.sync.enabled = true;
          saveSyncState();
          // Pull remote (may overwrite local)
          await syncPull(true);
        } else {
          // Create new gist with current local data
          if (!state.sync.localAt) updateLocalTimestamp();
          const created = await githubApi('POST', '/gists', {
            description: SYNC_DESC,
            public: false,
            files: { [SYNC_FILENAME]: { content: JSON.stringify(getSyncPayload()) } },
          });
          state.sync.gistId = created.id;
          state.sync.enabled = true;
          state.sync.lastAt = nowIso();
          state.sync.status = 'ok';
          saveSyncState();
        }
      } catch (e) {
        state.sync.status = 'error';
        state.sync.error = e.message || 'Erreur inconnue';
        state.sync.token = '';
        state.sync.gistId = '';
        state.sync.enabled = false;
        saveSyncState();
      }
      render();
    }

    async function syncPull(silentIfSame) {
      if (!state.sync.enabled) return;
      state.sync.status = 'syncing';
      state.sync.error = '';
      render();
      try {
        const gist = await githubApi('GET', `/gists/${state.sync.gistId}`);
        const file = gist.files && gist.files[SYNC_FILENAME];
        if (!file) throw new Error('Fichier sync manquant dans le Gist');
        let content = file.content;
        if (file.truncated && file.raw_url) {
          const raw = await fetch(file.raw_url);
          content = await raw.text();
        }
        const data = JSON.parse(content);
        const remoteAt = data.updatedAt;
        // Compare with local
        if (state.sync.localAt && new Date(state.sync.localAt) > new Date(remoteAt)) {
          // Local is fresher: don't overwrite
          state.sync.status = 'ok';
          state.sync.lastAt = nowIso();
          saveSyncState();
          render();
          return;
        }
        if (!state.sync.localAt || new Date(remoteAt) > new Date(state.sync.localAt)) {
          // Remote is newer, apply
          suspendPushSchedule = true;
          if (data.program) { state.program = data.program; save(K_PROGRAM, state.program); }
          if (data.library) { state.library = data.library; save(K_LIBRARY, state.library); }
          if (data.progress) { state.progress = data.progress; save(K_PROGRESS, state.progress); }
          suspendPushSchedule = false;
          state.sync.localAt = remoteAt;
        }
        state.sync.status = 'ok';
        state.sync.lastAt = nowIso();
        saveSyncState();
        render();
      } catch (e) {
        state.sync.status = 'error';
        state.sync.error = e.message || 'Erreur inconnue';
        render();
      }
    }

    async function syncPush() {
      if (!state.sync.enabled) return;
      state.sync.status = 'syncing';
      state.sync.error = '';
      render();
      try {
        const payload = getSyncPayload();
        await githubApi('PATCH', `/gists/${state.sync.gistId}`, {
          files: { [SYNC_FILENAME]: { content: JSON.stringify(payload) } },
        });
        state.sync.lastAt = nowIso();
        state.sync.status = 'ok';
        saveSyncState();
        render();
      } catch (e) {
        state.sync.status = 'error';
        state.sync.error = e.message || 'Erreur inconnue';
        render();
      }
    }

    async function syncNow() {
      if (!state.sync.enabled) return;
      await syncPull();
      // If local was fresher, syncPull didn't push. Do a push to ensure remote is up to date.
      if (state.sync.status !== 'error') await syncPush();
    }

    function syncDisable() {
      if (!confirm('Désactiver la sync sur cet appareil ? Le token sera retiré (le Gist reste dans ton GitHub).')) return;
      state.sync.token = '';
      state.sync.gistId = '';
      state.sync.enabled = false;
      state.sync.status = 'idle';
      state.sync.error = '';
      state.sync.lastAt = null;
      // keep localAt so if user re-activates, comparison works
      saveSyncState();
      render();
    }

    // Auto-pull when tab becomes visible
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.sync.enabled && state.sync.status !== 'syncing') {
        syncPull();
      }
    });

    // ============================================================
    // INIT
    // ============================================================
    loadAll();
    // Auto-detect editor mode
    try {
      const saved = localStorage.getItem(K_EDITOR_MODE);
      if (saved === 'pc' || saved === 'mobile') state.editorMode = saved;
      else state.editorMode = window.innerWidth >= 900 ? 'pc' : 'mobile';
    } catch (e) { state.editorMode = window.innerWidth >= 900 ? 'pc' : 'mobile'; }

    // Seed defaults if empty
    let seeded = false;
    if (!state.library || Object.keys(state.library).length === 0) { state.library = deepClone(DEFAULT_LIBRARY); seeded = true; }
    if (!state.program || !state.program.weeks || state.program.weeks.length === 0) { state.program = deepClone(DEFAULT_PROGRAM); seeded = true; }
    // Migration: ensure every lib entry has muscles array
    let libMigrated = false;
    Object.values(state.library).forEach(ex => {
      if (!ex.muscles) {
        const def = DEFAULT_LIBRARY[ex.id];
        ex.muscles = def?.muscles ? [...def.muscles] : [];
        libMigrated = true;
      }
    });
    if (seeded || libMigrated) {
      suspendPushSchedule = true;
      saveLibrary(); saveProgram();
      suspendPushSchedule = false;
    }

    initPcDragDrop();
    render();

    // Kick off initial sync pull if activated (non-blocking)
    if (state.sync.enabled) { setTimeout(() => syncPull(), 100); }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
