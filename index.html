<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>PL Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PL Tracker">
  <meta name="theme-color" content="#F5F2ED">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      /* Palette light + warm coral */
      --bg-page: #F5F2ED;
      --bg-page-alt: #EFEBE3;
      --bg-card: #FFFFFF;
      --bg-glass: rgba(255, 255, 255, 0.78);
      --bg-subtle: #F0EDE7;
      --bg-hover: #EBE7DF;
      --bg-input: #F7F5F1;

      --border-1: rgba(31, 31, 36, 0.08);
      --border-2: rgba(31, 31, 36, 0.14);
      --border-3: rgba(31, 31, 36, 0.22);

      --text-1: #1F1F24;
      --text-2: #6B6862;
      --text-3: #A5A29A;
      --text-inv: #FFFFFF;

      --accent: #E85D3E;
      --accent-hover: #D14E30;
      --accent-soft: #FFE8E1;
      --accent-glow: rgba(232, 93, 62, 0.15);

      --success: #4CAF50;
      --success-soft: #E8F5E9;
      --warning: #F59E0B;
      --warning-soft: #FEF3C7;
      --danger: #EF4444;
      --danger-soft: #FEE2E2;

      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
      --r-full: 999px;

      --sh-sm: 0 1px 2px rgba(31, 31, 36, 0.04), 0 1px 3px rgba(31, 31, 36, 0.04);
      --sh-md: 0 4px 12px rgba(31, 31, 36, 0.06), 0 2px 4px rgba(31, 31, 36, 0.04);
      --sh-lg: 0 12px 32px rgba(31, 31, 36, 0.08), 0 4px 12px rgba(31, 31, 36, 0.06);
      --sh-accent: 0 6px 20px rgba(232, 93, 62, 0.28);
      --sh-success: 0 4px 12px rgba(76, 175, 80, 0.25);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg-page);
      color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Display', 'Inter', system-ui, sans-serif;
      font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body { padding-top: env(safe-area-inset-top); }

    input, select, textarea {
      -webkit-appearance: none; appearance: none;
      font-family: inherit; color: var(--text-1);
    }
    input:focus, select:focus, textarea:focus { outline: none; }

    button {
      cursor: pointer; font-family: inherit;
      background: transparent; border: none; padding: 0;
      color: inherit;
      transition: transform 100ms ease-out, background 150ms, color 150ms, box-shadow 150ms;
    }
    button:active { transform: scale(0.97); }

    .app {
      min-height: 100vh; background: var(--bg-page);
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
      max-width: 600px; margin: 0 auto; position: relative;
    }
    .app.pc-mode { max-width: none; }
    .pad { padding: 28px 20px 20px; }

    .eyebrow {
      font-size: 11px; letter-spacing: 1.4px;
      color: var(--text-2); font-weight: 600; text-transform: uppercase;
    }
    h1 {
      font-size: 34px; font-weight: 800; letter-spacing: -0.8px;
      margin: 6px 0 0 0; line-height: 1.05; color: var(--text-1);
    }
    .section-label {
      font-size: 11px; letter-spacing: 1.4px;
      color: var(--text-2); font-weight: 600; text-transform: uppercase;
    }
    .empty {
      text-align: center; color: var(--text-3);
      font-size: 14px; padding: 48px 20px; font-style: italic;
    }

    /* ================== NAV (glass pill) ================== */
    .nav {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0));
      left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 400px; height: 64px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--r-full);
      box-shadow: 0 12px 40px rgba(31, 31, 36, 0.12), 0 2px 8px rgba(31, 31, 36, 0.04);
      display: flex; padding: 6px; z-index: 20;
    }
    .nav-pill {
      position: absolute; top: 6px; bottom: 6px; left: 6px;
      width: calc((100% - 12px) / 3);
      background: var(--accent);
      border-radius: var(--r-full);
      box-shadow: var(--sh-accent);
      transition: transform 450ms cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 0;
    }
    .tab-btn {
      flex: 1; position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; color: var(--text-2); font-weight: 600;
      transition: color 300ms; border-radius: var(--r-full); padding: 0 6px;
      min-width: 0;
    }
    .tab-icon { font-size: 18px; line-height: 1; }
    .tab-label {
      font-size: 13px; opacity: 0; max-width: 0;
      overflow: hidden; white-space: nowrap;
      transition: opacity 220ms 120ms, max-width 320ms;
    }
    .tab-btn.active { color: white; }
    .tab-btn.active .tab-label { opacity: 1; max-width: 120px; }

    /* ================== PROGRAMME ================== */
    .week-tabs { display: grid; gap: 6px; margin-top: 24px; margin-bottom: 20px; }
    .week-tab {
      padding: 12px 4px; background: var(--bg-card);
      color: var(--text-2); border: 1px solid var(--border-1);
      font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
      border-radius: var(--r-md);
      box-shadow: var(--sh-sm);
    }
    .week-tab.active {
      background: var(--accent); color: white; border-color: var(--accent);
      box-shadow: var(--sh-accent);
    }
    .block-badge {
      display: inline-block; padding: 6px 12px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 11px; letter-spacing: 1px; font-weight: 700;
      margin-bottom: 14px; border-radius: var(--r-full);
      text-transform: uppercase;
    }
    .day-row {
      width: 100%; background: var(--bg-card);
      border-left: 4px solid transparent;
      padding: 18px 18px 18px 20px; margin-bottom: 10px;
      color: var(--text-1); text-align: left;
      display: flex; justify-content: space-between; align-items: center;
      border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
      transition: box-shadow 200ms, transform 100ms;
    }
    .day-row:active { transform: scale(0.99); box-shadow: var(--sh-md); }
    .day-row.done { border-left-color: var(--success); }
    .day-row.test { border-left-color: var(--accent); }
    .day-label { font-size: 11px; letter-spacing: 1.2px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
    .day-name { font-size: 17px; font-weight: 700; color: var(--text-1); line-height: 1.2; }
    .day-date { font-size: 12px; color: var(--text-3); margin-top: 6px; }
    .day-arrow {
      color: var(--text-3); font-size: 20px;
      width: 36px; height: 36px; border-radius: var(--r-full);
      background: var(--bg-subtle);
      display: flex; align-items: center; justify-content: center;
    }
    .day-arrow.done { color: white; background: var(--success); }

    /* ================== SESSION ================== */
    .back-btn {
      color: var(--text-2); font-size: 13px; letter-spacing: 0.3px;
      margin-bottom: 20px; padding: 8px 14px 8px 10px; font-weight: 600;
      background: var(--bg-card); border-radius: var(--r-full);
      box-shadow: var(--sh-sm);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .session-progress {
      display: flex; align-items: center; gap: 12px;
      margin-top: 12px; margin-bottom: 24px;
      font-size: 12px; color: var(--text-2); font-weight: 600;
    }
    .mini-bar { flex: 1; height: 6px; background: var(--bg-subtle); border-radius: var(--r-full); overflow: hidden; }
    .mini-bar-fill { height: 100%; background: var(--accent); border-radius: var(--r-full); transition: width 0.4s; }
    .ex-card {
      background: var(--bg-card); padding: 20px; margin-bottom: 14px;
      border-radius: var(--r-lg); box-shadow: var(--sh-sm);
    }
    .ex-name { font-size: 16px; font-weight: 700; color: var(--text-1); margin-bottom: 4px; }
    .ex-target { font-size: 13px; color: var(--accent); font-weight: 600; }
    .ex-note {
      font-size: 12px; color: var(--text-2); margin-top: 6px;
      font-style: italic; padding: 8px 12px;
      background: var(--bg-subtle); border-radius: var(--r-sm);
    }

    .sets-grid { display: grid; grid-template-columns: 22px 1fr 60px 1fr 44px; gap: 8px; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-1); }
    .sets-grid.with-label { grid-template-columns: 22px 70px 1fr 55px 1fr 44px; }
    .set-head {
      font-size: 10px; letter-spacing: 1px; color: var(--text-3);
      font-weight: 700; text-transform: uppercase;
      padding-bottom: 6px; text-align: center;
    }
    .set-num { font-size: 13px; color: var(--text-3); font-weight: 700; text-align: center; }
    .set-input {
      background: var(--bg-input); border: 1.5px solid transparent;
      color: var(--text-1); padding: 10px 6px;
      font-size: 15px; font-weight: 700; text-align: center;
      border-radius: var(--r-md); width: 100%;
      transition: border-color 150ms, background 150ms;
    }
    .set-input:focus { border-color: var(--accent); background: white; outline: none; }
    .set-input.done-input { color: var(--success); background: var(--success-soft); font-weight: 700; }
    .set-input.done-input:focus { border-color: var(--success); background: white; }
    .set-label { font-size: 11px; color: var(--text-2); line-height: 1.2; padding-right: 4px; font-weight: 600; }
    .set-label.attempt { color: var(--accent); font-weight: 800; }
    .set-target-reps { font-size: 15px; color: var(--text-2); font-weight: 700; text-align: center; padding: 10px 2px; background: var(--bg-subtle); border-radius: var(--r-md); }
    .set-check {
      width: 40px; height: 40px;
      border: 2px solid var(--border-2);
      border-radius: var(--r-full); background: var(--bg-card);
      font-size: 18px; font-weight: 700; color: var(--text-3);
      display: flex; align-items: center; justify-content: center;
      transition: all 200ms;
    }
    .set-check.done {
      background: var(--success); color: white;
      border-color: var(--success);
      box-shadow: var(--sh-success);
    }

    .timer {
      position: fixed;
      bottom: calc(96px + env(safe-area-inset-bottom, 0));
      left: 16px; right: 16px;
      max-width: 560px; margin: 0 auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--r-xl);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: var(--sh-lg);
      z-index: 25;
    }
    .timer-lbl { font-size: 10px; letter-spacing: 1.4px; color: var(--text-2); font-weight: 700; flex: 1; text-transform: uppercase; }
    .timer-num { font-size: 32px; font-weight: 800; color: var(--accent); font-family: ui-monospace, monospace; letter-spacing: -1px; margin: 0 16px; }
    .timer-skip { color: var(--text-2); border: 1px solid var(--border-1); padding: 8px 14px; font-size: 11px; letter-spacing: 0.8px; font-weight: 700; border-radius: var(--r-full); background: var(--bg-card); }

    .cta {
      width: 100%; padding: 18px; background: var(--accent);
      color: white; font-weight: 700; font-size: 15px;
      letter-spacing: 0.3px; border-radius: var(--r-full);
      box-shadow: var(--sh-accent);
      transition: background 200ms, box-shadow 200ms, transform 100ms;
    }
    .cta:hover { background: var(--accent-hover); }
    .cta:active { transform: scale(0.98); }

    /* ================== MUSCLES ================== */
    .muscles-week-tabs { display: grid; gap: 6px; margin-top: 22px; margin-bottom: 18px; }
    .muscles-summary {
      background: var(--bg-card); padding: 18px 20px;
      margin-bottom: 20px; border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
    }
    .muscles-summary-title { font-size: 11px; letter-spacing: 1.4px; color: var(--text-2); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; }
    .muscles-summary-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .muscles-summary-item { display: flex; flex-direction: column; gap: 4px; }
    .muscles-summary-val { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1; letter-spacing: -0.5px; }
    .muscles-summary-val.done { color: var(--success); }
    .muscles-summary-lbl { font-size: 11px; color: var(--text-2); font-weight: 500; }

    .muscle-row {
      display: flex; align-items: center;
      padding: 16px 18px; background: var(--bg-card);
      margin-bottom: 8px; border-left: 4px solid var(--accent);
      gap: 12px; border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
    }
    .muscle-row.empty { border-left-color: var(--border-2); opacity: 0.55; }
    .muscle-row.empty .muscle-stat-val { color: var(--text-3); }
    .muscle-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text-1); }
    .muscle-stats { display: flex; gap: 14px; align-items: baseline; }
    .muscle-stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .muscle-stat-val { font-size: 16px; font-weight: 800; color: var(--accent); line-height: 1; }
    .muscle-stat-val.done { color: var(--success); }
    .muscle-stat-lbl { font-size: 9px; letter-spacing: 0.8px; color: var(--text-3); font-weight: 700; text-transform: uppercase; }

    /* ================== EDITOR TOGGLE ================== */
    .ed-view-toggle {
      display: flex; background: var(--bg-input);
      padding: 4px; border-radius: var(--r-full);
      border: 1px solid var(--border-1);
    }
    .ed-toggle-btn { background: transparent; color: var(--text-2); padding: 8px 14px; font-size: 12px; font-weight: 600; border-radius: var(--r-full); }
    .ed-toggle-btn.active { background: var(--accent); color: white; box-shadow: var(--sh-accent); }
    .med-view-toggle {
      display: flex; background: var(--bg-input);
      padding: 4px; border-radius: var(--r-full);
      border: 1px solid var(--border-1);
      margin-top: 14px; margin-bottom: 6px;
    }
    .med-toggle-btn { flex: 1; background: transparent; color: var(--text-2); padding: 10px 10px; font-size: 12px; font-weight: 600; border-radius: var(--r-full); }
    .med-toggle-btn.active { background: var(--accent); color: white; box-shadow: var(--sh-accent); }

    /* ================== EDITOR MOBILE ================== */
    .med-header { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; margin-bottom: 6px; }
    .med-title { flex: 1; font-size: 26px; font-weight: 800; color: var(--text-1); letter-spacing: -0.6px; line-height: 1.1; }
    .med-title-btn { color: var(--text-3); padding: 8px 12px; font-size: 15px; }
    .med-title-btn:active { color: var(--accent); }

    .med-week-tabs { display: grid; gap: 6px; margin-top: 20px; margin-bottom: 16px; }
    .med-week-tab {
      padding: 12px 4px; background: var(--bg-card);
      color: var(--text-2); border: 1px solid var(--border-1);
      font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
      border-radius: var(--r-md); box-shadow: var(--sh-sm);
    }
    .med-week-tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: var(--sh-accent); }
    .med-week-tab-add {
      color: var(--accent); border-color: var(--accent);
      border-style: dashed; background: var(--accent-soft);
      font-size: 16px; box-shadow: none;
    }

    .med-week-info { margin-bottom: 18px; padding: 16px 18px; background: var(--bg-card); border-radius: var(--r-lg); box-shadow: var(--sh-sm); }
    .med-week-badge { font-size: 11px; letter-spacing: 1.4px; color: var(--text-1); font-weight: 700; text-transform: uppercase; }
    .med-week-meta { font-size: 12px; color: var(--text-3); margin-top: 4px; font-weight: 500; }
    .med-week-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 14px; }
    .med-week-action-btn {
      padding: 10px 4px; background: var(--bg-input);
      color: var(--text-2); border: 1px solid transparent;
      font-size: 11px; letter-spacing: 0.3px; font-weight: 600;
      border-radius: var(--r-md);
    }
    .med-week-action-btn.danger { color: var(--danger); background: var(--danger-soft); }
    .med-week-action-btn:active { background: var(--bg-hover); }

    .med-day {
      background: var(--bg-card); margin-bottom: 12px;
      border-left: 4px solid var(--border-2);
      border-radius: var(--r-lg); box-shadow: var(--sh-sm);
      overflow: hidden;
    }
    .med-day-head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border-1); gap: 8px; }
    .med-day-info { flex: 1; min-width: 0; }
    .med-day-label { font-size: 11px; letter-spacing: 1.2px; color: var(--text-2); font-weight: 600; text-transform: uppercase; }
    .med-day-name { font-size: 16px; font-weight: 700; color: var(--text-1); margin-top: 4px; }
    .med-day-actions { display: flex; gap: 0; flex-shrink: 0; }
    .med-day-body { padding: 10px; }

    .med-ex {
      background: var(--bg-page); padding: 12px 14px; margin-bottom: 6px;
      border-left: 3px solid var(--border-2);
      border-radius: var(--r-md);
    }
    .med-ex.main-mark { border-left-color: var(--accent); background: var(--accent-soft); }
    .med-ex-line-1 { display: flex; align-items: center; gap: 4px; }
    .med-ex-marker { padding: 6px 8px; font-size: 12px; color: var(--text-3); background: transparent; border: none; }
    .med-ex-marker.main { color: var(--accent); }
    .med-ex-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .med-ex-actions { display: flex; gap: 0; flex-shrink: 0; }
    .med-ex-line-2 { display: flex; align-items: center; gap: 4px; margin-top: 10px; padding-left: 30px; flex-wrap: wrap; }
    .med-inline-input {
      background: var(--bg-card); border: 1.5px solid var(--border-1);
      color: var(--accent); padding: 8px 4px; font-size: 14px;
      font-weight: 700; text-align: center; height: 38px;
      border-radius: var(--r-md);
      transition: border-color 150ms;
    }
    .med-inline-input.actual { color: var(--success); }
    .med-inline-input:focus { border-color: var(--accent); outline: none; background: white; }
    .med-inline-input.actual:focus { border-color: var(--success); }
    .med-inline-input.i-sets { width: 46px; }
    .med-inline-input.i-reps { width: 50px; }
    .med-inline-input.i-actual { width: 50px; }
    .med-inline-input.i-weight { width: 66px; }
    .med-inline-input::-webkit-outer-spin-button, .med-inline-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .med-inline-sep { color: var(--text-3); font-size: 14px; font-weight: 600; margin: 0 2px; }
    .med-inline-unit { font-size: 11px; color: var(--text-2); font-weight: 600; margin-left: 2px; }
    .med-inline-slash { color: var(--text-3); font-size: 16px; margin: 0 1px; }
    .med-ex-extras { font-size: 11px; color: var(--text-2); margin-top: 8px; padding-left: 30px; font-weight: 500; }
    .med-ex-note { font-size: 12px; color: var(--text-2); font-style: italic; margin-top: 8px; padding-left: 30px; }

    .med-icon-btn { color: var(--text-3); padding: 10px; font-size: 15px; min-width: 40px; background: transparent; border: none; border-radius: var(--r-md); }
    .med-icon-btn.danger { color: var(--danger); }
    .med-icon-btn:active { background: var(--bg-hover); }

    .med-add-btn {
      display: block; width: 100%; padding: 11px;
      background: transparent; border: 1.5px dashed var(--border-2);
      color: var(--text-2); font-size: 12px; letter-spacing: 0.3px;
      margin-top: 6px; font-weight: 600;
      border-radius: var(--r-md);
    }
    .med-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .med-add-btn-lg { padding: 14px; margin-top: 10px; font-size: 12px; letter-spacing: 0.5px; }

    .med-admin { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--border-1); }
    .med-admin-title { font-size: 11px; letter-spacing: 1.4px; color: var(--text-2); font-weight: 700; margin-bottom: 14px; text-transform: uppercase; }
    .med-admin-btns { display: grid; gap: 8px; }
    .med-admin-btn {
      padding: 14px 14px; background: var(--bg-card);
      color: var(--text-1); border: 1px solid var(--border-1);
      font-size: 12px; letter-spacing: 0.3px; font-weight: 600;
      text-align: center; border-radius: var(--r-md);
      box-shadow: var(--sh-sm);
    }
    .med-admin-btn.danger { color: var(--danger); }
    .med-admin-btn:active { background: var(--bg-hover); }

    /* ================== EDITOR PC ================== */

    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    function saveLibrary() { save(K_LIBRARY, state.library); schedulePush(); }
    function saveProgram() { save(K_PROGRAM, state.program); schedulePush(); }
    function loadAll() {
      try { const r = localStorage.getItem(K_PROGRESS); if (r) state.progress = JSON.parse(r); } catch (e) {}
      try { const r = localStorage.getItem(K_LIBRARY); if (r) state.library = JSON.parse(r); } catch (e) {}
      try { const r = localStorage.getItem(K_PROGRAM); if (r) state.program = JSON.parse(r); } catch (e) {}
      // Sync state
      try {
        state.sync.token = localStorage.getItem(K_SYNC_TOKEN) || '';
        state.sync.gistId = localStorage.getItem(K_SYNC_GIST_ID) || '';
        state.sync.lastAt = localStorage.getItem(K_SYNC_LAST_AT) || null;
        state.sync.localAt = localStorage.getItem(K_SYNC_LOCAL_AT) || null;
        state.sync.enabled = !!state.sync.token && !!state.sync.gistId;
      } catch (e) {}
    }
    function saveSyncState() {
      try {
        if (state.sync.token) localStorage.setItem(K_SYNC_TOKEN, state.sync.token); else localStorage.removeItem(K_SYNC_TOKEN);
        if (state.sync.gistId) localStorage.setItem(K_SYNC_GIST_ID, state.sync.gistId); else localStorage.removeItem(K_SYNC_GIST_ID);
        if (state.sync.lastAt) localStorage.setItem(K_SYNC_LAST_AT, state.sync.lastAt); else localStorage.removeItem(K_SYNC_LAST_AT);
        if (state.sync.localAt) localStorage.setItem(K_SYNC_LOCAL_AT, state.sync.localAt); else localStorage.removeItem(K_SYNC_LOCAL_AT);
      } catch (e) {}
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtTime(s) { const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, '0')}`; }
    function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
    function fmtDateShort(s) { if (!s) return ''; return new Date(s + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
    function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
    function parseRepsInt(r) { if (typeof r === 'number') return r; if (r == null || r === '') return 0; const m = String(r).match(/^\d+/); return m ? parseInt(m[0]) : 0; }
    function getLibEx(id) { return state.library[id] || null; }
    function getExDef(ex) {
      if (ex.libId) { const lib = getLibEx(ex.libId); if (lib) return lib; }
      if (ex.name) { const f = Object.values(state.library).find(x => x.name === ex.name); if (f) return f; return { name: ex.name, group: 'other', muscles: [] }; }
      return { name: '?', group: 'other', muscles: [] };
    }
    function programWeeks() { return state.program.weeks || []; }
    function findWeekById(id) { return programWeeks().find(w => w.id === id); }
    function findDayById(wId, dId) { const w = findWeekById(wId); return w ? w.days.find(d => d.id === dId) : null; }
    function sessionKey(wId, dId) { return `${wId}::${dId}`; }

      if (!state.openWeek && programWeeks().length > 0) state.openWeek = programWeeks()[0].id;

      return `<div class="pad">

            <div class="block-badge">${esc(w.name)}</div>
            ${w.days.map(d => {

              const preview = (d.ex || []).slice(0, 3).map(e => getExDef(e).name.split(' ')[0]).join(' · ');
              const more = d.ex.length > 3 ? ` · +${d.ex.length - 3}` : '';
              const cls = `day-row ${done ? 'done' : ''} ${d.isTest ? 'test' : ''}`.trim();
              return `<button class="${cls}" data-action="start-session" data-week="${w.id}" data-day="${d.id}">
                <div>
                  <div class="day-label">${esc(d.label)}${d.date ? ' · ' + fmtDateShort(d.date) : ''}</div>

      </div>`;
    }

    // ============================================================
    // RENDER: MUSCLES
    // ============================================================
    function computeMuscleVolume(weekFilter) {
      // weekFilter = 'total' | weekId
      const totals = {};
      MUSCLES.forEach(m => totals[m] = { sets: 0, repsTarget: 0, repsActual: 0, setsActual: 0 });

      programWeeks().forEach(w => {
        if (weekFilter !== 'total' && w.id !== weekFilter) return;
        w.days.forEach(d => {
          (d.ex || []).forEach(ex => {
            const def = getExDef(ex);
            const muscles = def.muscles || [];
            if (muscles.length === 0) return;
            const sets = parseInt(ex.sets) || 0;
            const repsT = parseRepsInt(ex.reps);
            const repsA = parseRepsInt(ex.repsActual);
            muscles.forEach(m => {
              if (!totals[m]) return;
              totals[m].sets += sets;
              totals[m].repsTarget += sets * repsT;
              if (repsA > 0) {
                totals[m].setsActual += sets;
                totals[m].repsActual += sets * repsA;
              }
            });
          });
        });
      });
      return totals;
    }

    function renderMuscles() {
      const weeks = programWeeks();
      if (!state.musclesWeek) state.musclesWeek = 'total';
      const totals = computeMuscleVolume(state.musclesWeek);

      let globalSets = 0, globalRepsT = 0, globalRepsA = 0;
      MUSCLES.forEach(m => {
        globalSets += totals[m].sets;
        globalRepsT += totals[m].repsTarget;
        globalRepsA += totals[m].repsActual;
      });

      const cols = Math.min(weeks.length + 1, 6);

      return `<div class="pad">
        <div class="eyebrow">VOLUME PAR MUSCLE</div>
        <h1>Muscles</h1>

        ${weeks.length > 0 ? `
          <div class="muscles-week-tabs" style="grid-template-columns: repeat(${cols}, 1fr);">

              <div class="muscles-summary-lbl">reps planifiées (cumul par muscle)</div>
            </div>
            ${globalRepsA > 0 ? `
              <div class="muscles-summary-item">
                <div class="muscles-summary-val done">${globalRepsA}</div>
                <div class="muscles-summary-lbl">reps réelles (cumul par muscle)</div>
              </div>
              <div class="muscles-summary-item">
                <div class="muscles-summary-val done">${globalRepsT > 0 ? Math.round(globalRepsA/globalRepsT*100) : 0}%</div>
                <div class="muscles-summary-lbl">completion volume</div>
              </div>
            ` : ''}
          </div>
        </div>

        ${MUSCLES.map(m => {
          const t = totals[m];
          const isEmpty = t.sets === 0;
          return `<div class="muscle-row ${isEmpty ? 'empty' : ''}">
            <div class="muscle-name">${esc(MUSCLE_LABELS[m])}</div>
            <div class="muscle-stats">
              <div class="muscle-stat">
                <div class="muscle-stat-val">${t.sets}</div>
                <div class="muscle-stat-lbl">SÉRIES</div>
              </div>
              <div class="muscle-stat">
                <div class="muscle-stat-val">${t.repsTarget}</div>
                <div class="muscle-stat-lbl">REPS VIS.</div>
              </div>
              ${t.repsActual > 0 ? `<div class="muscle-stat">
                <div class="muscle-stat-val done">${t.repsActual}</div>
                <div class="muscle-stat-lbl">REPS RÉEL</div>
              </div>` : ''}
            </div>
          </div>`;
        }).join('')}

        <div style="margin-top: 24px; padding: 12px 14px; background: var(--bg-2); font-size: 11px; color: var(--text-3); line-height: 1.5;">
          Un exercice sollicitant plusieurs muscles compte pour chacun d'eux. Ex : 4 séries de squat = 4 séries pour quadriceps + 4 pour fessiers + 4 pour ischios. Modifie les muscles associés dans l'éditeur → bibliothèque.
        </div>
      </div>`;
    }

    // ============================================================
    // RENDER: EDITOR DISPATCHER
    // ============================================================
    function renderEditor() {
      if (state.editorMode === 'pc') return renderEditorPc();
      return renderEditorMobile();
    }

    // ============================================================
    // RENDER: EDITOR MOBILE
    // ============================================================
    function renderEditorMobile() {
      const weeks = programWeeks();
      if (weeks.length && (!state.openWeek || !weeks.find(w => w.id === state.openWeek))) {
        state.openWeek = weeks[0].id;
      }
      const current = weeks.find(w => w.id === state.openWeek);
      const cols = Math.min(weeks.length + 1, 6) || 1;

      return `<div class="pad">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div class="eyebrow">ÉDITEUR · sauvegarde auto</div>
          ${state.sync.enabled ? `<div class="sync-chip ${state.sync.status}" data-action="open-sync">
            <span class="sync-chip-icon">${state.sync.status === 'syncing' ? '⟳' : state.sync.status === 'error' ? '⚠' : '☁'}</span>
            <span>SYNC</span>
          </div>` : ''}
        </div>
        <div class="med-view-toggle">
          <button class="med-toggle-btn active" data-action="set-editor-mode" data-mode="mobile">📱 iPhone</button>
          <button class="med-toggle-btn" data-action="set-editor-mode" data-mode="pc">💻 PC</button>
        </div>
        <div class="med-header">
          <div class="med-title">${esc(state.program.name || 'Programme sans nom')}</div>
          <button class="med-title-btn" data-action="rename-program" title="Renommer">✎</button>
        </div>

        ${weeks.length === 0 ? `

          <button class="cta" data-action="add-week">+ AJOUTER UNE SEMAINE</button>
        ` : `
          <div class="med-week-tabs" style="grid-template-columns: repeat(${cols}, 1fr);">
            ${weeks.map((w, i) => `<button class="med-week-tab ${w.id === state.openWeek ? 'active' : ''}" data-action="open-week" data-week="${w.id}">S${i+1}</button>`).join('')}
            <button class="med-week-tab med-week-tab-add" data-action="add-week" title="Ajouter une semaine">+</button>
          </div>
          ${current ? renderMobEdWeek(current) : ''}
        `}

        <div class="med-admin">
          <div class="med-admin-title">OPTIONS</div>
          <div class="med-admin-btns">
            <button class="med-admin-btn" data-action="open-sync">☁ SYNC CLOUD (GITHUB) ${state.sync.enabled ? '· ACTIVE' : '· NON ACTIVÉE'}</button>
            <button class="med-admin-btn" data-action="open-library-manager">GÉRER LA BIBLIOTHÈQUE</button>
            <button class="med-admin-btn" data-action="open-bulk-muscles">ATTRIBUER MUSCLES EN MASSE</button>
            <button class="med-admin-btn" data-action="import-program">IMPORTER UN PROGRAMME</button>
            <button class="med-admin-btn" data-action="export-program">EXPORTER (SAUVEGARDE)</button>
            <button class="med-admin-btn danger" data-action="reset-program">RESTAURER LE PEAK BLOCK PAR DÉFAUT</button>
          </div>
        </div>
      </div>`;
    }

    function renderMobEdWeek(w) {
      return `
        <div class="med-week-info">
          <div>
            <div class="med-week-badge">${esc(w.name).toUpperCase()}</div>
            <div class="med-week-meta">${w.days.length} séance${w.days.length > 1 ? 's' : ''}</div>
          </div>
          <div class="med-week-actions">
            <button class="med-week-action-btn" data-action="rename-week" data-week="${w.id}">✎ Renommer</button>
            <button class="med-week-action-btn" data-action="duplicate-week" data-week="${w.id}">⧉ Dupliquer</button>
            <button class="med-week-action-btn danger" data-action="delete-week" data-week="${w.id}">× Supprimer</button>
          </div>
        </div>
        ${w.days.map(d => renderMobEdDay(w.id, d)).join('')}

      `;
    }

    function renderMobEdDay(wId, d) {
      return `<div class="med-day">
        <div class="med-day-head">
          <div class="med-day-info">
            <div class="med-day-label">${esc(d.label)}${d.date ? ' · ' + fmtDateShort(d.date) : ''}${d.isTest ? ' · TEST' : ''}</div>
            <div class="med-day-name">${esc(d.name)}</div>
          </div>
          <div class="med-day-actions">
            <button class="med-icon-btn" data-action="edit-day" data-week="${wId}" data-day="${d.id}" title="Modifier">✎</button>
            <button class="med-icon-btn" data-action="duplicate-day" data-week="${wId}" data-day="${d.id}" title="Dupliquer">⧉</button>
            <button class="med-icon-btn danger" data-action="delete-day" data-week="${wId}" data-day="${d.id}" title="Supprimer">×</button>

        </div>
      </div>`;
    }

    function renderMobEdEx(wId, dId, ex, i) {
      const def = getExDef(ex);
      const canInline = !ex.isTest;
      const extras = [];
      if (ex.rest) extras.push(`repos ${ex.rest}s`);
      return `<div class="med-ex ${ex.main ? 'main-mark' : ''}">
        <div class="med-ex-line-1">
          <button class="med-ex-marker ${ex.main ? 'main' : ''}" data-action="edit-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Repos, note, principal">${ex.main ? '●' : '○'}</button>
          <span class="med-ex-name">${esc(def.name)}</span>
          <div class="med-ex-actions">
            ${canInline ? `<button class="med-icon-btn" data-action="edit-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Repos, note">✎</button>` : ''}
            <button class="med-icon-btn danger" data-action="delete-exercise" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Supprimer">×</button>
          </div>
        </div>
        ${canInline ? `
          <div class="med-ex-line-2">
            <input class="med-inline-input i-sets" type="number" inputmode="numeric" min="1" value="${ex.sets ?? ''}" data-inline="sets" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Séries">
            <span class="med-inline-sep">×</span>
            <input class="med-inline-input i-reps" type="text" inputmode="numeric" value="${esc(ex.reps ?? '')}" data-inline="reps" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Reps visées">
            <span class="med-inline-slash">/</span>
            <input class="med-inline-input i-actual actual" type="text" inputmode="numeric" value="${esc(ex.repsActual ?? '')}" data-inline="repsActual" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" title="Reps réellement faites" placeholder="—">
            <span class="med-inline-sep">@</span>
            <input class="med-inline-input i-weight" type="number" step="2.5" inputmode="decimal" value="${ex.weight ?? ''}" data-inline="weight" data-week="${wId}" data-day="${dId}" data-ex-idx="${i}" placeholder="—" title="Charge">
            <span class="med-inline-unit">kg</span>
          </div>
        ` : `<div class="med-ex-extras">${ex.overrides ? ex.overrides.length : ex.sets} étapes · non modifiable</div>`}
        ${extras.length ? `<div class="med-ex-extras">${esc(extras.join(' · '))}</div>` : ''}
        ${ex.note ? `<div class="med-ex-note">${esc(ex.note)}</div>` : ''}
      </div>`;
    }

    // ============================================================
    // RENDER: EDITOR PC
    // ============================================================
    function renderEditorPc() {
      const weeks = programWeeks();
      const selectedCount = Object.values(state.selectedLibIds).filter(Boolean).length;
      return `<div class="pc-editor">
        <div class="pc-editor-header">
          <div class="pc-header-left">
            <div class="pc-header-eyebrow">ÉDITEUR · sauvegarde auto</div>
            <div class="pc-header-title" data-action="rename-program" title="Cliquer pour renommer">
              ${esc(state.program.name || 'Programme sans nom')} <span class="pc-header-pen">✎</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${state.sync.enabled ? `<div class="sync-chip ${state.sync.status}" data-action="open-sync" title="${esc(state.sync.status === 'error' ? state.sync.error : (state.sync.lastAt ? 'Sync ' + fmtRelative(state.sync.lastAt) : 'Sync activée'))}">
              <span class="sync-chip-icon">${state.sync.status === 'syncing' ? '⟳' : state.sync.status === 'error' ? '⚠' : '☁'}</span>
              <span>SYNC</span>

        <div class="pc-editor-split">

            <div class="pc-panel-body">
              ${weeks.length === 0
                ? `<div class="pc-empty">Aucune semaine. Clique "+ SEMAINE" en haut pour commencer.</div>`

              <div class="pc-admin">

                <button class="pc-tool-btn" data-action="export-program">↑ EXPORT</button>
                <button class="pc-tool-btn" data-action="reset-program">↻ DÉFAUT</button>
              </div>
            </div>
          </section>
          <section class="pc-panel pc-panel-library">
            <div class="pc-panel-head">
              <span class="pc-panel-title">BIBLIOTHÈQUE</span>
              <button class="pc-tool-btn primary" data-action="add-lib-exercise">+ EXERCICE</button>

              <select class="pc-lib-filter" id="pc-lib-filter">
                <option value="all">Tous groupes</option>

              </select>
              <button class="pc-tool-btn" data-action="open-bulk-muscles" title="Attribution muscles en masse">MUSCLES ${selectedCount ? '(' + selectedCount + ')' : ''}</button>
            </div>
            ${selectedCount > 0 ? `<div class="pc-bulk-bar">
              <span class="pc-bulk-count">${selectedCount} exercice${selectedCount > 1 ? 's' : ''} sélectionné${selectedCount > 1 ? 's' : ''}</span>
              <button class="pc-tool-btn primary" data-action="open-bulk-muscles">ATTRIBUER MUSCLES</button>
              <button class="pc-tool-btn" data-action="clear-lib-selection">DÉSÉLECTIONNER</button>
            </div>` : ''}
            <div class="pc-panel-body" id="pc-lib-body">
              ${renderPcLibraryList()}
            </div>
          </section>
        </div>
      </div>`;
